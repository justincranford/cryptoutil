[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=75.1", "wheel" ]

[project]
name = "cryptoutil"
version = "0.1.0"
description = "Cryptographic utilities"
readme = "README.md"
authors = [ { name = "Justin Cranford" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
optional-dependencies.dependencies = [
  "codecov>=2.1.13",
  "pytest>=9",
  "pytest-benchmark>=5.2.3",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
  "sphinx>=8.2.3",
  "types-requests>=2.32",
]
optional-dependencies.dev = [
  "golangci-lint>=2.14", # Minimum version enforced - always use latest
]

[tool.ruff]
target-version = "py314"
line-length = 200
format.indent-style = "space"
# Black-compatible formatting settings
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [ "B", "C90", "E", "F", "I", "SIM", "UP", "W" ]
lint.ignore = [
  "B008", # do not perform function calls in argument defaults
  "E203", # whitespace before ':' (black-compatible)
]
# Increased from default 10 to accommodate security validation functions.
lint.mccabe.max-complexity = 12

[tool.pytest]
ini_options.minversion = "7.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q -strict-markers --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=96"

[tool.coverage]
run.source = [ "." ]
run.omit = [ "*/__pycache__/*", "*/test_*.py", "*/tests/*", "*/venv/*" ]
run.precision = 2

[tool.node]
dependencies = [ "nvm-windows>=1.2.2", "node>=24.22.0", "cspell>=9.0.0" ]
