# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# CRYPTOUTIL SUITE application-only model (SUITE-Level)
#
# Purpose: Complete suite deployment with ALL 7 services across 3 products.
# Deployment Level: SUITE (port range 28000-28999, SERVICE base + 20000 offset)
# Each PS-ID has 4 instances: 2 SQLite + 2 PostgreSQL.
#
# Port formula: SUITE_PORT = SERVICE_BASE + 20000
#
# Usage:
#   cd deployments/cryptoutil
#   docker compose -f compose.yml up -d
#   docker compose -f compose.yml down
#
# The include path group combines product services with the suite overrides.

include:
  - path:
      - ../sm/compose-apps.yml
      - ../identity/compose-apps.yml
      - ../skeleton/compose-apps.yml
      - ../cryptoutil/compose-apps-overrides.yml
