      - source: tier-postgres-url-identity-rs.secret
        target: postgres-url.secret

  identity-rp-app-postgresql-1:
    secrets: !override
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: tier-postgres-url-identity-rp.secret
