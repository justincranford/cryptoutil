services:
  postgres-leader:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    volumes:
      - cryptoutil-certs:/mnt/ps-certs-src:ro

  postgres-follower:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    depends_on:
      pki-init:
        condition: service_completed_successfully
      sm-kms-app-postgresql-1:
        condition: service_healthy
      sm-kms-app-postgresql-2:
        condition: service_healthy
      identity-authz-app-postgresql-1:
        condition: service_healthy
      identity-authz-app-postgresql-2:
        condition: service_healthy
      identity-idp-app-postgresql-1:
        condition: service_healthy
      identity-idp-app-postgresql-2:
        condition: service_healthy
      identity-rs-app-postgresql-1:
        condition: service_healthy
      identity-rs-app-postgresql-2:
        condition: service_healthy
      identity-rp-app-postgresql-1:
        condition: service_healthy
      identity-rp-app-postgresql-2:
        condition: service_healthy
      identity-spa-app-postgresql-1:
        condition: service_healthy
      identity-spa-app-postgresql-2:
        condition: service_healthy
      skeleton-template-app-postgresql-1:
        condition: service_healthy
      skeleton-template-app-postgresql-2:
        condition: service_healthy
    environment:
      POSTGRES_CERT_SCOPE: cryptoutil
      POSTGRES_REPLICATION_TIER: suite
      POSTGRES_REPLICATION_PSIDS: sm-kms,identity-authz,identity-idp,identity-rs,identity-rp,identity-spa,skeleton-template
    volumes:
      - cryptoutil-certs:/mnt/ps-certs-src:ro

  sm-kms-app-postgresql-1:
    secrets: !override
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: tier-postgres-url-sm-kms.secret
        target: postgres-url.secret

  sm-kms-app-postgresql-2:
    secrets: !override
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: tier-postgres-url-sm-kms.secret
        target: postgres-url.secret

  identity-authz-app-postgresql-1:
    secrets: !override
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: tier-postgres-url-identity-authz.secret
        target: postgres-url.secret

  identity-authz-app-postgresql-2:
    secrets: !override
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: tier-postgres-url-identity-authz.secret
        target: postgres-url.secret

  identity-idp-app-postgresql-1:
