services:
  postgres-leader:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    volumes:
      - sm-certs:/mnt/ps-certs-src:ro

  postgres-follower:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    depends_on:
      pki-init:
        condition: service_completed_successfully
      sm-kms-app-postgresql-1:
        condition: service_healthy
      sm-kms-app-postgresql-2:
        condition: service_healthy
    environment:
      POSTGRES_CERT_SCOPE: sm
      POSTGRES_REPLICATION_TIER: product
      POSTGRES_REPLICATION_PSIDS: sm-kms
    volumes:
      - sm-certs:/mnt/ps-certs-src:ro

secrets:
  tier-postgres-username.secret:
    file: ../sm/secrets/postgres-username.secret
  tier-postgres-password.secret:
    file: ../sm/secrets/postgres-password.secret
