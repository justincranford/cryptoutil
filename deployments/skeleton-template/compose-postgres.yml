services:
  postgres-leader:
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu; SSL=/var/lib/postgresql/ssl
        mkdir -p "$$SSL"
        cp /mnt/ps-certs-src/skeleton-template/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.crt "$$SSL/server.crt"
        cp /mnt/ps-certs-src/skeleton-template/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.key "$$SSL/server.key"
        cp /mnt/ps-certs-src/skeleton-template/postgres-tls-client-issuing-ca/truststore/postgres-tls-client-issuing-ca.crt "$$SSL/client-ca.crt"
        chown 999:999 "$$SSL/server.crt" "$$SSL/server.key" "$$SSL/client-ca.crt"
        chmod 600 "$$SSL/server.key"
        chmod 644 "$$SSL/server.crt" "$$SSL/client-ca.crt"
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - skeleton-template-certs:/mnt/ps-certs-src:ro

  postgres-follower:
    depends_on:
      pki-init:
        condition: service_completed_successfully
      skeleton-template-app-postgresql-1:
        condition: service_healthy
      skeleton-template-app-postgresql-2:
        condition: service_healthy
    environment:
      POSTGRES_CERT_SCOPE: skeleton-template
      POSTGRES_REPLICATION_TIER: service
      POSTGRES_REPLICATION_PSIDS: skeleton-template
    volumes:
      - skeleton-template-certs:/mnt/ps-certs-src:ro
