# PRODUCT-level overrides for the imported PS-ID application models.
#
# PRODUCT-level PKI init (overrides PS-ID cert material).
services:
  pki-init:
    image: cryptoutil-skeleton-template:local
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        /app/skeleton-template init --domain=skeleton --output-dir=/certs
        chown -R 65532:65532 /certs
        find /host-certs -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /certs/. /host-certs/
        for cert_dir in /certs/skeleton/public-https-server-entity-*-sqlite-1; do
          [ -d "$$cert_dir" ] || continue
          psid=$${cert_dir##*/public-https-server-entity-}
          psid=$${psid%-sqlite-1}
          rm -rf "/certs/$$psid"
          ln -s "skeleton" "/certs/$$psid"
        done
    volumes:
      - skeleton-certs:/certs:rw
      - ./certs/:/host-certs/:rw
    depends_on:
      builder-skeleton-template:
        condition: service_completed_successfully

  skeleton-template-app-sqlite-1:
    ports: !override
      - "18900:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-sqlite-2:
    ports: !override
      - "18901:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-postgresql-1:
    ports: !override
      - "18902:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-postgresql-2:
    ports: !override
      - "18903:8080"
    volumes:
      - skeleton-certs:/certs:ro

  otel-certs-init:
    volumes:
      - skeleton-certs:/certs-source:ro
      - skeleton-otel-certs:/etc/pki-init/certs

secrets:
  # PRODUCT-level secrets override PS-ID secrets (paths resolve from the first included app compose file).
  # CRITICAL: ALL SKELETON instances MUST use the SAME unseal secrets
  # to enable shared encryption/decryption of data in the database.
  # NEVER create instance-specific or PS-ID-specific secrets.
  unseal-1of5.secret:
    file: ../skeleton/secrets/unseal-1of5.secret # pragma: allowlist secret
  unseal-2of5.secret:
    file: ../skeleton/secrets/unseal-2of5.secret
  unseal-3of5.secret:
    file: ../skeleton/secrets/unseal-3of5.secret
  unseal-4of5.secret:
    file: ../skeleton/secrets/unseal-4of5.secret
  unseal-5of5.secret:
    file: ../skeleton/secrets/unseal-5of5.secret
  hash-pepper-v3.secret:
    file: ../skeleton/secrets/hash-pepper-v3.secret
  postgres-url.secret:
    file: ../skeleton/secrets/postgres-url.secret
  postgres-url-sm-kms.secret:
    file: ../skeleton/secrets/postgres-url/sm-kms.secret
  postgres-url-identity-authz.secret:
    file: ../skeleton/secrets/postgres-url/identity-authz.secret
  postgres-url-identity-idp.secret:
    file: ../skeleton/secrets/postgres-url/identity-idp.secret
  postgres-url-identity-rs.secret:
    file: ../skeleton/secrets/postgres-url/identity-rs.secret
  postgres-url-identity-rp.secret:
    file: ../skeleton/secrets/postgres-url/identity-rp.secret
  postgres-url-identity-spa.secret:
    file: ../skeleton/secrets/postgres-url/identity-spa.secret
  postgres-url-skeleton-template.secret:
    file: ../skeleton/secrets/postgres-url/skeleton-template.secret
  postgres-username.secret:
    file: ../skeleton/secrets/postgres-username.secret
  postgres-password.secret:
    file: ../skeleton/secrets/postgres-password.secret
  postgres-database.secret:
    file: ../skeleton/secrets/postgres-database.secret

volumes:
  skeleton-certs:
  skeleton-otel-certs:
