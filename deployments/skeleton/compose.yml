# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# SKELETON Product Compose entry point
#
# Includes app-only child models and one shared PostgreSQL pair with product settings.
#
# Usage:
#   docker compose -f compose.yml up -d
#   docker compose -f compose.yml logs -f
#   docker compose -f compose.yml down -v
#
include:
  - path:
      - ./compose-apps.yml
      - ../shared-postgres/compose.yml
      - ../skeleton-template/compose-postgres.yml
      - ./compose-postgres.yml
      - ./compose-telemetry.yml
    env_file: ../skeleton-template/.env.postgres
