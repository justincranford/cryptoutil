# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# SKELETON Product Docker Compose Configuration
#
# PRODUCT-level deployment for Skeleton.
# Recursive includes: SKELETON product (1 service: template) (which include shared-postgres and shared-telemetry).
#
# Port allocation (PRODUCT level: SERVICE + 10000).
#
# Usage:
#   docker compose -f compose.yml up -d
#   docker compose -f compose.yml logs -f
#   docker compose -f compose.yml down -v
#

include:
  - path: ../skeleton-template/compose.yml

services:
  # PRODUCT-level port overrides: SERVICE ports + 10000.
  # Service definitions (image, command, volumes, secrets, depends_on) are inherited from PS-ID includes.

  # PRODUCT-level PKI init (overrides PS-ID cert material).
  pki-init:
    image: cryptoutil-skeleton-template:local
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        /app/skeleton-template init --domain=skeleton --output-dir=/certs
        chown -R 65532:65532 /certs
        find /host-certs -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /certs/. /host-certs/
        for cert_dir in /certs/skeleton/public-https-server-entity-*-sqlite-1; do
          [ -d "$$cert_dir" ] || continue
          psid=$${cert_dir##*/public-https-server-entity-}
          psid=$${psid%-sqlite-1}
          rm -rf "/certs/$$psid"
          ln -s "skeleton" "/certs/$$psid"
        done
    volumes:
      - skeleton-certs:/certs:rw
      - ./certs/:/host-certs/:rw
    depends_on:
      builder-skeleton-template:
        condition: service_completed_successfully

  skeleton-template-app-sqlite-1:
    ports: !override
      - "18900:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-sqlite-2:
    ports: !override
      - "18901:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-postgresql-1:
    ports: !override
      - "18902:8080"
    volumes:
      - skeleton-certs:/certs:ro

  skeleton-template-app-postgresql-2:
    ports: !override
      - "18903:8080"
    volumes:
      - skeleton-certs:/certs:ro

  otel-certs-init:
    volumes:
      - skeleton-certs:/certs-source:ro

  postgres-leader:
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro

  grafana-otel-lgtm:
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro

secrets:
  # PRODUCT-level secrets override PS-ID secrets (paths resolve relative to this file).
  # CRITICAL: ALL SKELETON instances MUST use the SAME unseal secrets
  # to enable shared encryption/decryption of data in the database.
  # NEVER create instance-specific or PS-ID-specific secrets.
  unseal-1of5.secret:
    file: ./secrets/unseal-1of5.secret # pragma: allowlist secret
  unseal-2of5.secret:
    file: ./secrets/unseal-2of5.secret
  unseal-3of5.secret:
    file: ./secrets/unseal-3of5.secret
  unseal-4of5.secret:
    file: ./secrets/unseal-4of5.secret
  unseal-5of5.secret:
    file: ./secrets/unseal-5of5.secret
  hash-pepper-v3.secret:
    file: ./secrets/hash-pepper-v3.secret
  postgres-url.secret:
    file: ./secrets/postgres-url.secret
  postgres-username.secret:
    file: ./secrets/postgres-username.secret
  postgres-password.secret:
    file: ./secrets/postgres-password.secret
  postgres-database.secret:
    file: ./secrets/postgres-database.secret

volumes:
  skeleton-certs:
