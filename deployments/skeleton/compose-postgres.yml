services:
  postgres-leader:
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro

  postgres-follower:
    depends_on:
      pki-init:
        condition: service_completed_successfully
      skeleton-template-app-postgresql-1:
        condition: service_healthy
      skeleton-template-app-postgresql-2:
        condition: service_healthy
    environment:
      POSTGRES_CERT_SCOPE: skeleton
      POSTGRES_REPLICATION_TIER: product
      POSTGRES_REPLICATION_PSIDS: skeleton-template
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro
