services:
  postgres-leader:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro

  postgres-follower:
    secrets: !override
      - source: tier-postgres-username.secret
        target: postgres-username.secret
      - source: tier-postgres-password.secret
        target: postgres-password.secret
    depends_on:
      pki-init:
        condition: service_completed_successfully
      skeleton-template-app-postgresql-1:
        condition: service_healthy
      skeleton-template-app-postgresql-2:
        condition: service_healthy
    environment:
      POSTGRES_CERT_SCOPE: skeleton
      POSTGRES_REPLICATION_TIER: product
      POSTGRES_REPLICATION_PSIDS: skeleton-template
    volumes:
      - skeleton-certs:/mnt/ps-certs-src:ro

secrets:
  tier-postgres-username.secret:
    file: ../skeleton/secrets/postgres-username.secret
  tier-postgres-password.secret:
    file: ../skeleton/secrets/postgres-password.secret
