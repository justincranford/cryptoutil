# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# IDENTITY-RS Docker Compose Configuration
#
# SERVICE-level deployment for Resource Server.
# Supports 4 instances: 2 SQLite + 2 PostgreSQL.
#
# Port allocation (SERVICE level: 8600-8699):
#   - identity-rs-app-sqlite-1:      8600
#   - identity-rs-app-sqlite-2:      8601
#   - identity-rs-app-postgresql-1:  8602
#   - identity-rs-app-postgresql-2:  8603
#
# Dual Role: Standalone deployable AND include target for PRODUCT/SUITE compose files.
# Usage:
#   docker compose -f compose.yml up -d                            # All instances
#   docker compose -f compose.yml up identity-rs-app-sqlite-1 -d   # Single instance
#   docker compose -f compose.yml logs -f                          # View logs
#   docker compose -f compose.yml down -v                          # Stop and clean up
#
# Health Checks:
#   - Public health endpoint: https://localhost:8600/browser/api/v1/health
#   - Admin livez endpoint: https://127.0.0.1:9090/admin/api/v1/livez (internal only)
#
include:
  - path: ./compose-telemetry.yml
  - path: ../shared-postgres/compose.yml
    env_file: .env.postgres

services:
  # Healthcheck for Docker secrets availability.
  healthcheck-secrets:
    image: alpine:latest
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - hash-pepper-v3.secret
      - postgres-url.secret
      - postgres-username.secret
      - postgres-password.secret
      - postgres-database.secret
      - browser-username.secret
      - browser-password.secret
      - service-username.secret
      - service-password.secret
    command:
      - sh
      - -c
      - |
        test -f /run/secrets/unseal-1of5.secret &&
        test -f /run/secrets/unseal-2of5.secret &&
        test -f /run/secrets/unseal-3of5.secret &&
        test -f /run/secrets/unseal-4of5.secret &&
        test -f /run/secrets/unseal-5of5.secret &&
        test -f /run/secrets/hash-pepper-v3.secret &&
        test -f /run/secrets/postgres-url.secret &&
        test -f /run/secrets/postgres-username.secret &&
        test -f /run/secrets/postgres-password.secret &&
        test -f /run/secrets/postgres-database.secret &&
        test -f /run/secrets/browser-username.secret &&
        test -f /run/secrets/browser-password.secret &&
        test -f /run/secrets/service-username.secret &&
        test -f /run/secrets/service-password.secret &&
        echo All secrets verified
    networks:
      - identity-rs-network

  # Build identity-rs image from source.
  builder-identity-rs:
    image: cryptoutil-identity-rs:local
    build:
      context: ../..
      dockerfile: deployments/identity-rs/Dockerfile
      args:
        APP_VERSION: "local"
        VCS_REF: "local"
        BUILD_DATE: "2026-02-17T00:00:00Z"
    entrypoint: ["sh", "-c"]
    command: ["echo 'Build completed successfully'"]
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully

  # Thorough Go binary secrets validation: verifies file presence, naming convention,
  # location (/run/secrets/), content length (>=43 chars), and format (base64url).
  # Runs after builder-identity-rs so the binary is available, before pki-init.
  validate-secrets-identity-rs:
    image: cryptoutil-identity-rs:local
    command: ["/app/identity-rs", "validate-secrets"]
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - hash-pepper-v3.secret
      - postgres-url.secret
      - postgres-username.secret
      - postgres-password.secret
      - postgres-database.secret
      - browser-username.secret
      - browser-password.secret
      - service-username.secret
      - service-password.secret
    depends_on:
      builder-identity-rs:
        condition: service_completed_successfully
    networks:
      - identity-rs-network

  # Init job creates fresh PKI material; dependents restart to reload rotated trust.
  pki-init:
    image: cryptoutil-identity-rs:local
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        /app/identity-rs init --domain=identity-rs --output-dir=/certs
        chown -R 65532:65532 /certs
    volumes:
      - identity-rs-certs:/certs
    depends_on:
      builder-identity-rs:
        condition: service_completed_successfully
      validate-secrets-identity-rs:
        condition: service_completed_successfully
    networks:
      - identity-rs-network

  # Copy the Collector listener trust and Grafana-issued exporter identity into its isolated volume.
  otel-certs-init:
    image: alpine:latest
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        source=/certs-source/identity-rs
        destination=/etc/pki-init/certs
        server_cert=public-https-server-entity-otel-collector-contrib
        client_ca=otel-collector-contrib-https-client-issuing-ca
        client_identity=grafana-otel-lgtm-https-client-entity-infra
        server_ca=public-https-server-issuing-ca
        rm -rf "$$destination"/*
        mkdir -p "$$destination/$$server_cert" "$$destination/$$client_ca/truststore" "$$destination/$$client_identity" "$$destination/$$server_ca/truststore"
        cp -p "$$source/$$server_cert/$$server_cert.crt" "$$destination/$$server_cert/"
        cp -p "$$source/$$server_cert/$$server_cert.key" "$$destination/$$server_cert/"
        cp -p "$$source/$$client_ca/truststore/$$client_ca.crt" "$$destination/$$client_ca/truststore/"
        cp -p "$$source/$$client_identity/$$client_identity.crt" "$$destination/$$client_identity/"
        cp -p "$$source/$$client_identity/$$client_identity.key" "$$destination/$$client_identity/"
        cp -p "$$source/$$server_ca/truststore/$$server_ca.crt" "$$destination/$$server_ca/truststore/"
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-rs-certs:/certs-source:ro
      - identity-rs-otel-certs:/etc/pki-init/certs

  # DISPOSABLE: in-memory SQLite data is lost when the process/container is recreated.
  # identity-rs server with SQLite backend (instance 1).
  identity-rs-app-sqlite-1:
    image: cryptoutil-identity-rs:local
    command: /bin/sh -c "exec /app/identity-rs server --config=/certs/tls-config.yml --config=/app/config/identity-rs-app-framework-common.yml --config=/app/config/identity-rs-app-framework-sqlite-1.yml --config=/app/config/identity-rs-app-domain-common.yml --config=/app/config/identity-rs-app-domain-sqlite-1.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u sqlite://file::memory:?cache=shared $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8600:8080" # HTTPS public
    volumes:
      - ./config/identity-rs-app-framework-common.yml:/app/config/identity-rs-app-framework-common.yml:ro
      - ./config/identity-rs-app-framework-sqlite-1.yml:/app/config/identity-rs-app-framework-sqlite-1.yml:ro
      - ./config/identity-rs-app-domain-common.yml:/app/config/identity-rs-app-domain-common.yml:ro
      - ./config/identity-rs-app-domain-sqlite-1.yml:/app/config/identity-rs-app-domain-sqlite-1.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-rs-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-rs:
        condition: service_completed_successfully
      validate-secrets-identity-rs:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-rs", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-rs/private-https-mutual-entity-identity-rs-sqlite-1/private-https-mutual-entity-identity-rs-sqlite-1.crt", "--key", "/certs/identity-rs/private-https-mutual-entity-identity-rs-sqlite-1/private-https-mutual-entity-identity-rs-sqlite-1.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-rs-network
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # DISPOSABLE: in-memory SQLite data is lost when the process/container is recreated.
  # identity-rs server with SQLite backend (instance 2).
  identity-rs-app-sqlite-2:
    image: cryptoutil-identity-rs:local
    command: /bin/sh -c "exec /app/identity-rs server --config=/certs/tls-config.yml --config=/app/config/identity-rs-app-framework-common.yml --config=/app/config/identity-rs-app-framework-sqlite-2.yml --config=/app/config/identity-rs-app-domain-common.yml --config=/app/config/identity-rs-app-domain-sqlite-2.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u sqlite://file::memory:?cache=shared $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8601:8080" # HTTPS public
    volumes:
      - ./config/identity-rs-app-framework-common.yml:/app/config/identity-rs-app-framework-common.yml:ro
      - ./config/identity-rs-app-framework-sqlite-2.yml:/app/config/identity-rs-app-framework-sqlite-2.yml:ro
      - ./config/identity-rs-app-domain-common.yml:/app/config/identity-rs-app-domain-common.yml:ro
      - ./config/identity-rs-app-domain-sqlite-2.yml:/app/config/identity-rs-app-domain-sqlite-2.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-rs-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-rs:
        condition: service_completed_successfully
      validate-secrets-identity-rs:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-rs", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-rs/private-https-mutual-entity-identity-rs-sqlite-2/private-https-mutual-entity-identity-rs-sqlite-2.crt", "--key", "/certs/identity-rs/private-https-mutual-entity-identity-rs-sqlite-2/private-https-mutual-entity-identity-rs-sqlite-2.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-rs-network
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # identity-rs server with PostgreSQL backend (instance 1).
  identity-rs-app-postgresql-1:
    image: cryptoutil-identity-rs:local
    restart: "on-failure"
    command: /bin/sh -c "exec /app/identity-rs server --config=/certs/tls-config.yml --config=/app/config/identity-rs-app-framework-common.yml --config=/app/config/identity-rs-app-framework-postgresql-1.yml --config=/app/config/identity-rs-app-domain-common.yml --config=/app/config/identity-rs-app-domain-postgresql-1.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u file:///run/secrets/postgres-url.secret $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8602:8080" # HTTPS public
    volumes:
      - ./config/identity-rs-app-framework-common.yml:/app/config/identity-rs-app-framework-common.yml:ro
      - ./config/identity-rs-app-framework-postgresql-1.yml:/app/config/identity-rs-app-framework-postgresql-1.yml:ro
      - ./config/identity-rs-app-domain-common.yml:/app/config/identity-rs-app-domain-common.yml:ro
      - ./config/identity-rs-app-domain-postgresql-1.yml:/app/config/identity-rs-app-domain-postgresql-1.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-rs-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: postgres-url-identity-rs.secret
        target: postgres-url.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-rs:
        condition: service_completed_successfully
      validate-secrets-identity-rs:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      postgres-leader:
        condition: service_healthy
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-rs", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-rs/private-https-mutual-entity-identity-rs-postgres-1/private-https-mutual-entity-identity-rs-postgres-1.crt", "--key", "/certs/identity-rs/private-https-mutual-entity-identity-rs-postgres-1/private-https-mutual-entity-identity-rs-postgres-1.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-rs-network
      - telemetry-network
      - postgres-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # identity-rs server with PostgreSQL backend (instance 2 - shared DB with instance 1).
  identity-rs-app-postgresql-2:
    image: cryptoutil-identity-rs:local
    restart: "on-failure"
    command: /bin/sh -c "exec /app/identity-rs server --config=/certs/tls-config.yml --config=/app/config/identity-rs-app-framework-common.yml --config=/app/config/identity-rs-app-framework-postgresql-2.yml --config=/app/config/identity-rs-app-domain-common.yml --config=/app/config/identity-rs-app-domain-postgresql-2.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u file:///run/secrets/postgres-url.secret $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8603:8080" # HTTPS public
    volumes:
      - ./config/identity-rs-app-framework-common.yml:/app/config/identity-rs-app-framework-common.yml:ro
      - ./config/identity-rs-app-framework-postgresql-2.yml:/app/config/identity-rs-app-framework-postgresql-2.yml:ro
      - ./config/identity-rs-app-domain-common.yml:/app/config/identity-rs-app-domain-common.yml:ro
      - ./config/identity-rs-app-domain-postgresql-2.yml:/app/config/identity-rs-app-domain-postgresql-2.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-rs-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - source: postgres-url-identity-rs.secret
        target: postgres-url.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-rs:
        condition: service_completed_successfully
      validate-secrets-identity-rs:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      postgres-leader:
        condition: service_healthy
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
      identity-rs-app-postgresql-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/identity-rs", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-rs/private-https-mutual-entity-identity-rs-postgres-2/private-https-mutual-entity-identity-rs-postgres-2.crt", "--key", "/certs/identity-rs/private-https-mutual-entity-identity-rs-postgres-2/private-https-mutual-entity-identity-rs-postgres-2.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-rs-network
      - telemetry-network
      - postgres-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # postgres-leader SSL setup - extends shared-postgres service with mTLS cert setup.
  # Runs as root to copy certs into a writable directory, chown to postgres (uid 999),
  # then drops to postgres user via docker-entrypoint.sh.
  postgres-leader:
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu; SSL=/var/lib/postgresql/ssl
        mkdir -p "$$SSL"
        cp /mnt/ps-certs-src/identity-rs/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.crt "$$SSL/server.crt"
        cp /mnt/ps-certs-src/identity-rs/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.key "$$SSL/server.key"
        cp /mnt/ps-certs-src/identity-rs/postgres-tls-client-issuing-ca/truststore/postgres-tls-client-issuing-ca.crt "$$SSL/client-ca.crt"
        chown 999:999 "$$SSL/server.crt" "$$SSL/server.key" "$$SSL/client-ca.crt"
        chmod 600 "$$SSL/server.key"
        chmod 644 "$$SSL/server.crt" "$$SSL/client-ca.crt"
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-rs-certs:/mnt/ps-certs-src:ro

volumes:
  identity-rs-certs:
  identity-rs-otel-certs:

networks:
  identity-rs-network:
    driver: bridge

secrets:
  unseal-1of5.secret:
    file: ./secrets/unseal-1of5.secret # pragma: allowlist secret
  unseal-2of5.secret:
    file: ./secrets/unseal-2of5.secret
  unseal-3of5.secret:
    file: ./secrets/unseal-3of5.secret
  unseal-4of5.secret:
    file: ./secrets/unseal-4of5.secret
  unseal-5of5.secret:
    file: ./secrets/unseal-5of5.secret
  hash-pepper-v3.secret:
    file: ./secrets/hash-pepper-v3.secret
  postgres-url.secret:
    file: ./secrets/postgres-url.secret
  postgres-url-identity-rs.secret:
    file: ./secrets/postgres-url.secret
  postgres-username.secret:
    file: ./secrets/postgres-username.secret
  postgres-password.secret:
    file: ./secrets/postgres-password.secret
  postgres-database.secret:
    file: ./secrets/postgres-database.secret
  browser-username.secret:
    file: ./secrets/browser-username.secret
  browser-password.secret:
    file: ./secrets/browser-password.secret
  service-username.secret:
    file: ./secrets/service-username.secret
  service-password.secret:
    file: ./secrets/service-password.secret
