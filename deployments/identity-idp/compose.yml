# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# IDENTITY-IDP Docker Compose Configuration
#
# SERVICE-level deployment for Provider.
# Supports 4 instances: 2 SQLite + 2 PostgreSQL.
#
# Port allocation (SERVICE level: 8500-8599):
#   - identity-idp-app-sqlite-1:      8500
#   - identity-idp-app-sqlite-2:      8501
#   - identity-idp-app-postgresql-1:  8502
#   - identity-idp-app-postgresql-2:  8503
#
# Dual Role: Standalone deployable AND include target for PRODUCT/SUITE compose files.
# Usage:
#   docker compose -f compose.yml up -d                             # All instances
#   docker compose -f compose.yml up identity-idp-app-sqlite-1 -d   # Single instance
#   docker compose -f compose.yml logs -f                           # View logs
#   docker compose -f compose.yml down -v                           # Stop and clean up
#
# Health Checks:
#   - Public health endpoint: https://localhost:8500/browser/api/v1/health
#   - Admin livez endpoint: https://127.0.0.1:9090/admin/api/v1/livez (internal only)
#
include:
  - path: ../shared-telemetry/compose.yml
  - path: ../shared-postgres/compose.yml
    env_file: .env.postgres

services:
  # Healthcheck for Docker secrets availability.
  healthcheck-secrets:
    image: alpine:latest
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - hash-pepper-v3.secret
      - postgres-url.secret
      - postgres-username.secret
      - postgres-password.secret
      - postgres-database.secret
      - browser-username.secret
      - browser-password.secret
      - service-username.secret
      - service-password.secret
    command:
      - sh
      - -c
      - |
        test -f /run/secrets/unseal-1of5.secret &&
        test -f /run/secrets/unseal-2of5.secret &&
        test -f /run/secrets/unseal-3of5.secret &&
        test -f /run/secrets/unseal-4of5.secret &&
        test -f /run/secrets/unseal-5of5.secret &&
        test -f /run/secrets/hash-pepper-v3.secret &&
        test -f /run/secrets/postgres-url.secret &&
        test -f /run/secrets/postgres-username.secret &&
        test -f /run/secrets/postgres-password.secret &&
        test -f /run/secrets/postgres-database.secret &&
        test -f /run/secrets/browser-username.secret &&
        test -f /run/secrets/browser-password.secret &&
        test -f /run/secrets/service-username.secret &&
        test -f /run/secrets/service-password.secret &&
        echo All secrets verified
    networks:
      - identity-idp-network

  # Build identity-idp image from source.
  builder-identity-idp:
    image: cryptoutil-identity-idp:local
    build:
      context: ../..
      dockerfile: deployments/identity-idp/Dockerfile
      args:
        APP_VERSION: "local"
        VCS_REF: "local"
        BUILD_DATE: "2026-02-17T00:00:00Z"
    entrypoint: ["sh", "-c"]
    command: ["echo 'Build completed successfully'"]
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully

  # Thorough Go binary secrets validation: verifies file presence, naming convention,
  # location (/run/secrets/), content length (>=43 chars), and format (base64url).
  # Runs after builder-identity-idp so the binary is available, before pki-init.
  validate-secrets-identity-idp:
    image: cryptoutil-identity-idp:local
    command: ["/app/identity-idp", "validate-secrets"]
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - hash-pepper-v3.secret
      - postgres-url.secret
      - postgres-username.secret
      - postgres-password.secret
      - postgres-database.secret
      - browser-username.secret
      - browser-password.secret
      - service-username.secret
      - service-password.secret
    depends_on:
      builder-identity-idp:
        condition: service_completed_successfully
    networks:
      - identity-idp-network

  # Init job creates fresh PKI material; dependents restart to reload rotated trust.
  pki-init:
    image: cryptoutil-identity-idp:local
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        /app/identity-idp init --domain=identity-idp --output-dir=/certs
        chown -R 65532:65532 /certs
    volumes:
      - identity-idp-certs:/certs
    depends_on:
      builder-identity-idp:
        condition: service_completed_successfully
      validate-secrets-identity-idp:
        condition: service_completed_successfully
    networks:
      - identity-idp-network

  # Copy the Collector listener trust and Grafana-issued exporter identity into its isolated volume.
  otel-certs-init:
    image: alpine:latest
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        source=/certs-source/identity-idp
        destination=/etc/pki-init/certs
        server_cert=public-https-server-entity-otel-collector-contrib
        client_ca=otel-collector-contrib-https-client-issuing-ca
        client_identity=grafana-otel-lgtm-https-client-entity-infra
        server_ca=public-https-server-issuing-ca
        rm -rf "$$destination"/*
        mkdir -p "$$destination/$$server_cert" "$$destination/$$client_ca/truststore" "$$destination/$$client_identity" "$$destination/$$server_ca/truststore"
        cp -p "$$source/$$server_cert/$$server_cert.crt" "$$destination/$$server_cert/"
        cp -p "$$source/$$server_cert/$$server_cert.key" "$$destination/$$server_cert/"
        cp -p "$$source/$$client_ca/truststore/$$client_ca.crt" "$$destination/$$client_ca/truststore/"
        cp -p "$$source/$$client_identity/$$client_identity.crt" "$$destination/$$client_identity/"
        cp -p "$$source/$$client_identity/$$client_identity.key" "$$destination/$$client_identity/"
        cp -p "$$source/$$server_ca/truststore/$$server_ca.crt" "$$destination/$$server_ca/truststore/"
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-idp-certs:/certs-source:ro
      - identity-idp-otel-certs:/etc/pki-init/certs

  # identity-idp server with SQLite backend (instance 1).
  identity-idp-app-sqlite-1:
    image: cryptoutil-identity-idp:local
    command: /bin/sh -c "exec /app/identity-idp server --config=/certs/tls-config.yml --config=/app/config/identity-idp-app-framework-common.yml --config=/app/config/identity-idp-app-framework-sqlite-1.yml --config=/app/config/identity-idp-app-domain-common.yml --config=/app/config/identity-idp-app-domain-sqlite-1.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u sqlite://file::memory:?cache=shared $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8500:8080" # HTTPS public
    volumes:
      - ./config/identity-idp-app-framework-common.yml:/app/config/identity-idp-app-framework-common.yml:ro
      - ./config/identity-idp-app-framework-sqlite-1.yml:/app/config/identity-idp-app-framework-sqlite-1.yml:ro
      - ./config/identity-idp-app-domain-common.yml:/app/config/identity-idp-app-domain-common.yml:ro
      - ./config/identity-idp-app-domain-sqlite-1.yml:/app/config/identity-idp-app-domain-sqlite-1.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-idp-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-idp:
        condition: service_completed_successfully
      validate-secrets-identity-idp:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-idp", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-idp/private-https-mutual-entity-identity-idp-sqlite-1/private-https-mutual-entity-identity-idp-sqlite-1.crt", "--key", "/certs/identity-idp/private-https-mutual-entity-identity-idp-sqlite-1/private-https-mutual-entity-identity-idp-sqlite-1.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-idp-network
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # identity-idp server with SQLite backend (instance 2).
  identity-idp-app-sqlite-2:
    image: cryptoutil-identity-idp:local
    command: /bin/sh -c "exec /app/identity-idp server --config=/certs/tls-config.yml --config=/app/config/identity-idp-app-framework-common.yml --config=/app/config/identity-idp-app-framework-sqlite-2.yml --config=/app/config/identity-idp-app-domain-common.yml --config=/app/config/identity-idp-app-domain-sqlite-2.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u sqlite://file::memory:?cache=shared $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8501:8080" # HTTPS public
    volumes:
      - ./config/identity-idp-app-framework-common.yml:/app/config/identity-idp-app-framework-common.yml:ro
      - ./config/identity-idp-app-framework-sqlite-2.yml:/app/config/identity-idp-app-framework-sqlite-2.yml:ro
      - ./config/identity-idp-app-domain-common.yml:/app/config/identity-idp-app-domain-common.yml:ro
      - ./config/identity-idp-app-domain-sqlite-2.yml:/app/config/identity-idp-app-domain-sqlite-2.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-idp-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-idp:
        condition: service_completed_successfully
      validate-secrets-identity-idp:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-idp", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-idp/private-https-mutual-entity-identity-idp-sqlite-2/private-https-mutual-entity-identity-idp-sqlite-2.crt", "--key", "/certs/identity-idp/private-https-mutual-entity-identity-idp-sqlite-2/private-https-mutual-entity-identity-idp-sqlite-2.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-idp-network
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # identity-idp server with PostgreSQL backend (instance 1).
  identity-idp-app-postgresql-1:
    image: cryptoutil-identity-idp:local
    restart: "on-failure"
    command: /bin/sh -c "exec /app/identity-idp server --config=/certs/tls-config.yml --config=/app/config/identity-idp-app-framework-common.yml --config=/app/config/identity-idp-app-framework-postgresql-1.yml --config=/app/config/identity-idp-app-domain-common.yml --config=/app/config/identity-idp-app-domain-postgresql-1.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u file:///run/secrets/postgres-url.secret $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8502:8080" # HTTPS public
    volumes:
      - ./config/identity-idp-app-framework-common.yml:/app/config/identity-idp-app-framework-common.yml:ro
      - ./config/identity-idp-app-framework-postgresql-1.yml:/app/config/identity-idp-app-framework-postgresql-1.yml:ro
      - ./config/identity-idp-app-domain-common.yml:/app/config/identity-idp-app-domain-common.yml:ro
      - ./config/identity-idp-app-domain-postgresql-1.yml:/app/config/identity-idp-app-domain-postgresql-1.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-idp-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - postgres-url.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-idp:
        condition: service_completed_successfully
      validate-secrets-identity-idp:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      postgres-leader:
        condition: service_healthy
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "/app/identity-idp", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-idp/private-https-mutual-entity-identity-idp-postgres-1/private-https-mutual-entity-identity-idp-postgres-1.crt", "--key", "/certs/identity-idp/private-https-mutual-entity-identity-idp-postgres-1/private-https-mutual-entity-identity-idp-postgres-1.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-idp-network
      - telemetry-network
      - postgres-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # identity-idp server with PostgreSQL backend (instance 2 - shared DB with instance 1).
  identity-idp-app-postgresql-2:
    image: cryptoutil-identity-idp:local
    restart: "on-failure"
    command: /bin/sh -c "exec /app/identity-idp server --config=/certs/tls-config.yml --config=/app/config/identity-idp-app-framework-common.yml --config=/app/config/identity-idp-app-framework-postgresql-2.yml --config=/app/config/identity-idp-app-domain-common.yml --config=/app/config/identity-idp-app-domain-postgresql-2.yml --config=/app/otel/otel.yml --bind-public-port=8080 -u file:///run/secrets/postgres-url.secret $$SUITE_ARGS"
    working_dir: /tmp
    ports:
      - "8503:8080" # HTTPS public
    volumes:
      - ./config/identity-idp-app-framework-common.yml:/app/config/identity-idp-app-framework-common.yml:ro
      - ./config/identity-idp-app-framework-postgresql-2.yml:/app/config/identity-idp-app-framework-postgresql-2.yml:ro
      - ./config/identity-idp-app-domain-common.yml:/app/config/identity-idp-app-domain-common.yml:ro
      - ./config/identity-idp-app-domain-postgresql-2.yml:/app/config/identity-idp-app-domain-postgresql-2.yml:ro
      - ../shared-telemetry/otel/cryptoutil-otel.yml:/app/otel/otel.yml:ro
      - identity-idp-certs:/certs:ro
    secrets:
      - unseal-1of5.secret
      - unseal-2of5.secret
      - unseal-3of5.secret
      - unseal-4of5.secret
      - unseal-5of5.secret
      - postgres-url.secret
    depends_on:
      healthcheck-secrets:
        condition: service_completed_successfully
      builder-identity-idp:
        condition: service_completed_successfully
      validate-secrets-identity-idp:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
        restart: true
      postgres-leader:
        condition: service_healthy
        restart: true
      opentelemetry-collector-contrib:
        condition: service_started
        restart: true
      healthcheck-opentelemetry-collector-contrib:
        condition: service_completed_successfully
        restart: true
      identity-idp-app-postgresql-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/identity-idp", "livez", "--cacert", "/certs/issuing-ca.pem", "--cert", "/certs/identity-idp/private-https-mutual-entity-identity-idp-postgres-2/private-https-mutual-entity-identity-idp-postgres-2.crt", "--key", "/certs/identity-idp/private-https-mutual-entity-identity-idp-postgres-2/private-https-mutual-entity-identity-idp-postgres-2.key"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - identity-idp-network
      - telemetry-network
      - postgres-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Direct PKI dependency reruns this one-shot readiness check after certificate regeneration.
  healthcheck-opentelemetry-collector-contrib:
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true

  # OTel Collector mTLS cert setup: Cat 2 server cert + Cat 8 client issuing CA.
  # Extends the shared-telemetry service with PS-ID-specific cert mounts so the
  # collector can present its server cert and verify app client certs (Cat 2 + Cat 8).
  # CRITICAL: otel/opentelemetry-collector-contrib is distroless (no bash/sh).
  # Certs are prepared by otel-certs-init (Alpine) into the identity-idp-otel-certs volume.
  # Direct PKI dependency ensures the long-running collector reloads rotated TLS material.
  opentelemetry-collector-contrib:
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
      otel-certs-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-idp-otel-certs:/etc/pki-init/certs:ro

  # Grafana HTTPS and OTLP ingest mTLS cert setup.
  # Extends the shared-telemetry Grafana service with PS-ID-specific cert mounts.
  grafana-otel-lgtm:
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-idp-certs:/mnt/ps-certs-src:ro
    environment:
      GF_SERVER_CERT_FILE: /mnt/ps-certs-src/identity-idp/public-https-server-entity-grafana-otel-lgtm/public-https-server-entity-grafana-otel-lgtm.crt
      GF_SERVER_CERT_KEY: /mnt/ps-certs-src/identity-idp/public-https-server-entity-grafana-otel-lgtm/public-https-server-entity-grafana-otel-lgtm.key
      OTELCOL_CLIENT_CA_FILE: /mnt/ps-certs-src/identity-idp/grafana-otel-lgtm-https-client-issuing-ca/truststore/grafana-otel-lgtm-https-client-issuing-ca.crt

  # postgres-leader SSL setup - extends shared-postgres service with mTLS cert setup.
  # Runs as root to copy certs into a writable directory, chown to postgres (uid 999),
  # then drops to postgres user via docker-entrypoint.sh.
  postgres-leader:
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu; SSL=/var/lib/postgresql/ssl
        mkdir -p "$$SSL"
        cp /mnt/ps-certs-src/identity-idp/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.crt "$$SSL/server.crt"
        cp /mnt/ps-certs-src/identity-idp/postgres-tls-server-entity-leader/postgres-tls-server-entity-leader.key "$$SSL/server.key"
        cp /mnt/ps-certs-src/identity-idp/postgres-tls-client-issuing-ca/truststore/postgres-tls-client-issuing-ca.crt "$$SSL/client-ca.crt"
        chown 999:999 "$$SSL/server.crt" "$$SSL/server.key" "$$SSL/client-ca.crt"
        chmod 600 "$$SSL/server.key"
        chmod 644 "$$SSL/server.crt" "$$SSL/client-ca.crt"
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      pki-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - identity-idp-certs:/mnt/ps-certs-src:ro

volumes:
  identity-idp-certs:
  identity-idp-otel-certs:

networks:
  identity-idp-network:
    driver: bridge

secrets:
  unseal-1of5.secret:
    file: ./secrets/unseal-1of5.secret # pragma: allowlist secret
  unseal-2of5.secret:
    file: ./secrets/unseal-2of5.secret
  unseal-3of5.secret:
    file: ./secrets/unseal-3of5.secret
  unseal-4of5.secret:
    file: ./secrets/unseal-4of5.secret
  unseal-5of5.secret:
    file: ./secrets/unseal-5of5.secret
  hash-pepper-v3.secret:
    file: ./secrets/hash-pepper-v3.secret
  postgres-url.secret:
    file: ./secrets/postgres-url.secret
  postgres-username.secret:
    file: ./secrets/postgres-username.secret
  postgres-password.secret:
    file: ./secrets/postgres-password.secret
  postgres-database.secret:
    file: ./secrets/postgres-database.secret
  browser-username.secret:
    file: ./secrets/browser-username.secret
  browser-password.secret:
    file: ./secrets/browser-password.secret
  service-username.secret:
    file: ./secrets/service-username.secret
  service-password.secret:
    file: ./secrets/service-password.secret
