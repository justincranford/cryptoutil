# PRODUCT-level overrides for the imported PS-ID application models.
#
# PRODUCT-level PKI init (overrides PS-ID cert material).
services:
  pki-init:
    image: cryptoutil-identity-authz:local
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        /app/identity-authz init --domain=identity --output-dir=/certs
        chown -R 65532:65532 /certs
        find /host-certs -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /certs/. /host-certs/
        for cert_dir in /certs/identity/public-https-server-entity-*-sqlite-1; do
          [ -d "$$cert_dir" ] || continue
          psid=$${cert_dir##*/public-https-server-entity-}
          psid=$${psid%-sqlite-1}
          rm -rf "/certs/$$psid"
          ln -s "identity" "/certs/$$psid"
        done
    volumes:
      - identity-certs:/certs:rw
      - ./certs/:/host-certs/:rw
    depends_on:
      builder-identity-authz:
        condition: service_completed_successfully

  identity-authz-app-sqlite-1:
    ports: !override
      - "18400:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-authz-app-sqlite-2:
    ports: !override
      - "18401:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-authz-app-postgresql-1:
    ports: !override
      - "18402:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-authz-app-postgresql-2:
    ports: !override
      - "18403:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-idp-app-sqlite-1:
    ports: !override
      - "18500:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-idp-app-sqlite-2:
    ports: !override
      - "18501:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-idp-app-postgresql-1:
    ports: !override
      - "18502:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-idp-app-postgresql-2:
    ports: !override
      - "18503:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rs-app-sqlite-1:
    ports: !override
      - "18600:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rs-app-sqlite-2:
    ports: !override
      - "18601:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rs-app-postgresql-1:
    ports: !override
      - "18602:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rs-app-postgresql-2:
    ports: !override
      - "18603:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rp-app-sqlite-1:
    ports: !override
      - "18700:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rp-app-sqlite-2:
    ports: !override
      - "18701:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rp-app-postgresql-1:
    ports: !override
      - "18702:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-rp-app-postgresql-2:
    ports: !override
      - "18703:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-spa-app-sqlite-1:
    ports: !override
      - "18800:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-spa-app-sqlite-2:
    ports: !override
      - "18801:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-spa-app-postgresql-1:
    ports: !override
      - "18802:8080"
    volumes:
      - identity-certs:/certs:ro

  identity-spa-app-postgresql-2:
    ports: !override
      - "18803:8080"
    volumes:
      - identity-certs:/certs:ro

  otel-certs-init:
    volumes:
      - identity-certs:/certs-source:ro
      - identity-otel-certs:/etc/pki-init/certs

secrets:
  # PRODUCT-level secrets override PS-ID secrets (paths resolve from the first included app compose file).
  # CRITICAL: ALL IDENTITY instances MUST use the SAME unseal secrets
  # to enable shared encryption/decryption of data in the database.
  # NEVER create instance-specific or PS-ID-specific secrets.
  unseal-1of5.secret:
    file: ../identity/secrets/unseal-1of5.secret # pragma: allowlist secret
  unseal-2of5.secret:
    file: ../identity/secrets/unseal-2of5.secret
  unseal-3of5.secret:
    file: ../identity/secrets/unseal-3of5.secret
  unseal-4of5.secret:
    file: ../identity/secrets/unseal-4of5.secret
  unseal-5of5.secret:
    file: ../identity/secrets/unseal-5of5.secret
  hash-pepper-v3.secret:
    file: ../identity/secrets/hash-pepper-v3.secret
  postgres-url.secret:
    file: ../identity/secrets/postgres-url.secret
  postgres-url-sm-kms.secret:
    file: ../identity/secrets/postgres-url/sm-kms.secret
  postgres-url-identity-authz.secret:
    file: ../identity/secrets/postgres-url/identity-authz.secret
  postgres-url-identity-idp.secret:
    file: ../identity/secrets/postgres-url/identity-idp.secret
  postgres-url-identity-rs.secret:
    file: ../identity/secrets/postgres-url/identity-rs.secret
  postgres-url-identity-rp.secret:
    file: ../identity/secrets/postgres-url/identity-rp.secret
  postgres-url-identity-spa.secret:
    file: ../identity/secrets/postgres-url/identity-spa.secret
  postgres-url-skeleton-template.secret:
    file: ../identity/secrets/postgres-url/skeleton-template.secret
  postgres-username.secret:
    file: ../identity/secrets/postgres-username.secret
  postgres-password.secret:
    file: ../identity/secrets/postgres-password.secret
  postgres-database.secret:
    file: ../identity/secrets/postgres-database.secret

volumes:
  identity-certs:
  identity-otel-certs:
