# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# IDENTITY Product Docker Compose Configuration
#
# PRODUCT application-only model for Identity.
# The include path group combines PS-ID services with the product overrides.
#
# Port allocation (PRODUCT level: SERVICE + 10000).
#
# Usage:
#   docker compose -f compose.yml up -d
#   docker compose -f compose.yml logs -f
#   docker compose -f compose.yml down -v
#

include:
  - path:
      - ../identity-authz/compose-apps.yml
      - ../identity-idp/compose-apps.yml
      - ../identity-rs/compose-apps.yml
      - ../identity-rp/compose-apps.yml
      - ../identity-spa/compose-apps.yml
      - ../identity/compose-apps-overrides.yml
