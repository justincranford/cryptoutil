# $schema: https://json.schemastore.org/github-action.json
# Doc: https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions

name: 'docker-compose-up'
description: 'Start Docker Compose services and wait for health checks'
inputs:
  compose-file:
    description: 'Path to the docker-compose file'
    required: false
    default: './deployments/cryptoutil/compose.yml'
  profiles:
    description: 'Comma-separated list of Docker Compose profiles to activate (e.g., "postgres")'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Start Docker Compose services
      shell: bash
      env:
        COMPOSE_INPUT_PATH: ${{ inputs.compose-file }}
        COMPOSE_PROFILES: ${{ inputs.profiles }}
      run: |
        echo "🚀 Starting Docker Compose services..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        COMPOSE_DIR="$(dirname "$COMPOSE_INPUT_PATH")"
        COMPOSE_FILE="$(basename "$COMPOSE_INPUT_PATH")"
        cd "$COMPOSE_DIR"

        # Build docker compose command with optional profiles
        COMPOSE_ARGS=(--file "$COMPOSE_FILE")
        if [ -n "$COMPOSE_PROFILES" ]; then
          echo "🎯 Activating profiles: $COMPOSE_PROFILES"
          # Split comma-separated profiles and add --profile flag for each
          IFS=',' read -ra PROFILE_ARRAY <<< "$COMPOSE_PROFILES"
          for profile in "${PROFILE_ARRAY[@]}"; do
            COMPOSE_ARGS+=(--profile "$(echo "$profile" | xargs)")
          done
        fi

        # Start services
        docker compose "${COMPOSE_ARGS[@]}" up -d

        echo "⏳ Waiting for services to be healthy..."
        timeout 120s bash -c '
          until docker compose "$@" ps | grep -q "healthy"; do
            echo "Waiting for healthy services..."
            sleep 5
          done
        ' _ "${COMPOSE_ARGS[@]}"

        echo "📋 Service status:"
        docker compose "${COMPOSE_ARGS[@]}" ps
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Docker Compose services startup completed in: ${DURATION}s"
