# $schema: https://json.schemastore.org/github-action.json
# Doc: https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions

name: 'docker-compose-up'
description: 'Start Docker Compose services and wait for health checks'
inputs:
  compose-file:
    description: 'Path to the docker-compose file'
    required: false
    default: './deployments/cryptoutil/compose.yml'
  profiles:
    description: 'Comma-separated list of Docker Compose profiles to activate (e.g., "postgres")'
    required: false
    default: ''
  required-completed-services:
    description: 'JSON array of one-shot services that must exit successfully'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Start Docker Compose services
      shell: bash
      env:
        COMPOSE_INPUT_PATH: ${{ inputs.compose-file }}
        COMPOSE_PROFILES: ${{ inputs.profiles }}
        REQUIRED_COMPLETED_SERVICES_JSON: ${{ inputs.required-completed-services }}
      run: |
        set -euo pipefail
        echo "🚀 Starting Docker Compose services..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        COMPOSE_DIR="$(dirname "$COMPOSE_INPUT_PATH")"
        COMPOSE_FILE="$(basename "$COMPOSE_INPUT_PATH")"
        cd "$COMPOSE_DIR"

        # Build docker compose command with optional profiles
        COMPOSE_ARGS=(--file "$COMPOSE_FILE")
        if [ -n "$COMPOSE_PROFILES" ]; then
          echo "🎯 Activating profiles: $COMPOSE_PROFILES"
          # Split comma-separated profiles and add --profile flag for each
          IFS=',' read -ra PROFILE_ARRAY <<< "$COMPOSE_PROFILES"
          for profile in "${PROFILE_ARRAY[@]}"; do
            COMPOSE_ARGS+=(--profile "$(echo "$profile" | xargs)")
          done
        fi

        # Compose waits for every selected long-running service; verify one-shot jobs separately.
        docker compose "${COMPOSE_ARGS[@]}" up -d --wait --wait-timeout 120

        echo "Service status:"
        docker compose "${COMPOSE_ARGS[@]}" ps --all
        export COMPOSE_STATE_JSON="$(docker compose "${COMPOSE_ARGS[@]}" ps --all --format json)"
        python3 - <<'PY'
        import json
        import os
        import sys

        try:
            required = json.loads(os.environ["REQUIRED_COMPLETED_SERVICES_JSON"])
        except (KeyError, json.JSONDecodeError) as error:
            print(f"ERROR: invalid required-completed-services JSON: {error}")
            sys.exit(1)

        if not isinstance(required, list) or not required or any(not isinstance(service, str) or not service.strip() for service in required):
            print("ERROR: required-completed-services must be a non-empty JSON array of service names")
            sys.exit(1)
        if len(set(required)) != len(required):
            print("ERROR: required-completed-services contains duplicate names")
            sys.exit(1)

        raw = os.environ.get("COMPOSE_STATE_JSON", "").strip()
        try:
            parsed = json.loads(raw) if raw else []
        except json.JSONDecodeError:
            try:
                parsed = [json.loads(line) for line in raw.splitlines() if line.strip()]
            except json.JSONDecodeError as error:
                print(f"ERROR: docker compose ps returned malformed JSON: {error}")
                sys.exit(1)

        if isinstance(parsed, dict):
            containers = [parsed]
        elif isinstance(parsed, list):
            containers = parsed
        else:
            print("ERROR: docker compose ps JSON must contain a container array")
            sys.exit(1)
        if any(not isinstance(container, dict) for container in containers):
            print("ERROR: docker compose ps JSON contains a malformed container entry")
            sys.exit(1)

        failures = []
        for service in required:
            matches = [container for container in containers if container.get("Service") == service]
            if len(matches) != 1:
                failures.append(f"{service}: found {len(matches)} containers (expected exactly one)")
                continue
            container = matches[0]
            if container.get("State") != "exited" or str(container.get("ExitCode")) != "0":
                failures.append(f"{service}: state={container.get('State')}, exitCode={container.get('ExitCode')}")

        if failures:
            print("ERROR: required one-shot Compose services did not each exit successfully:")
            for failure in failures:
                print(f"  {failure}")
            sys.exit(1)

        print("All required one-shot Compose services exited with code 0.")
        PY
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Docker Compose services startup completed in: ${DURATION}s"
