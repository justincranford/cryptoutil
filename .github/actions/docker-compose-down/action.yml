# $schema: https://json.schemastore.org/github-action.json
# Doc: https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions

name: 'docker-compose-down'
description: 'Stop Docker Compose services and remove containers and networks while preserving volumes'
inputs:
  compose-file:
    description: 'Path to the Docker Compose file'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Stop services
      shell: bash
      env:
        COMPOSE_INPUT_PATH: ${{ inputs.compose-file }}
      run: |
        echo "🧹 Stopping services..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        COMPOSE_DIR="$(dirname "$COMPOSE_INPUT_PATH")"
        COMPOSE_FILE="$(basename "$COMPOSE_INPUT_PATH")"
        cd "$COMPOSE_DIR"
        docker compose -f "$COMPOSE_FILE" down
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Service cleanup completed in: ${DURATION}s"
