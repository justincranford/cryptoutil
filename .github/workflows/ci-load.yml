# $schema: https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# WORKFLOW: Load Testing
# PURPOSE: Performance validation using Gatling load testing framework (Java 21 + Maven 3.10)
# DEPENDENCIES: Docker Compose stack (cryptoutil services + PostgreSQL), Java 21, Maven 3.10
# EXPECTED DURATION: 10-20min (Docker Compose startup + Gatling simulation execution)
# TIMEOUT: 45min (allows Docker builds + stack startup + Gatling load simulation + report generation)
# CRITICAL PATH: Docker Compose stack startup (60-150s) + Gatling simulation (5-15min depending on load profile)

name: CI - Load Testing
# CROSS-PLATFORM COMPATIBILITY: All file references in this workflow MUST use relative paths
# to support both GitHub Actions Ubuntu runners and Windows `act` local runner testing.
# Absolute paths (e.g., C:\...) break cross-platform compatibility.
# Example: Use './deployments/sm-kms/compose.yml'

on:
  push:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with pull_request below
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  pull_request:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with push above
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are intentional for load-test parameterization
  workflow_dispatch:
    inputs:
      load_profile:
        description: 'Load test profile (complete exercises every encryption algorithm)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - standard
          - stress
          - complete
      virtual_clients:
        description: 'Number of virtual clients (overrides profile defaults)'
        required: false
        default: '0'
        type: string
      duration_seconds:
        description: 'Test duration in seconds (overrides profile defaults)'
        required: false
        default: '0'
        type: string

env:
  VIRTUAL_CLIENTS_OVERRIDE: ${{ github.event.inputs.virtual_clients || '0' }}
  DURATION_OVERRIDE: ${{ github.event.inputs.duration_seconds || '0' }}

jobs:
  load-testing:
    name: Load Testing with Gatling (${{ matrix.load_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        load_profile: ${{ fromJSON(github.event_name == 'push' && '["quick","standard","stress"]' || format('["{0}"]', github.event.inputs.load_profile || 'standard')) }}
    env:
      LOAD_PROFILE: ${{ matrix.load_profile }}

    steps:
    - name: Checkout code
      # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
      uses: actions/checkout@v6.0.2
      with:
        sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

    - name: Begin Workflow Job
      id: begin-workflow-job
      uses: ./.github/actions/workflow-job-begin

    - name: Set up Go and validate dependencies
      uses: ./.github/actions/go-setup
      with:
        go-version: ${{ steps.begin-workflow-job.outputs.go-version }}
        go-mod-download: true
        go-mod-verify: true
        go-mod-tidy: true

    - name: Set up Java
      # https://github.com/actions/setup-java/releases (v5.0.0, 2025-04-21)
      uses: actions/setup-java@v5.0.0
      with:
        distribution: 'temurin'
        java-version: ${{ steps.begin-workflow-job.outputs.java-version }}
        cache: 'maven'

    - name: Pre-pull Docker images (parallel)
      uses: ./.github/actions/docker-images-pull
      with:
        images: |
          postgres:latest
          alpine:latest
          golang:1.27.3
          otel/opentelemetry-collector-contrib:latest
          grafana/otel-lgtm:latest

    - name: Build Docker images
      uses: ./.github/actions/docker-compose-build
      with:
        compose-file: './deployments/sm-kms/compose.yml'

    - name: Start Docker Compose services
      uses: ./.github/actions/docker-compose-up
      with:
        compose-file: './deployments/sm-kms/compose.yml'
        required-completed-services: >-
          ["healthcheck-secrets", "builder-sm-kms", "validate-secrets-sm-kms", "pki-init", "otel-certs-init", "healthcheck-opentelemetry-collector-contrib"]
        profiles: 'postgres'

    - name: Verify services are ready
      uses: ./.github/actions/docker-compose-verify
      with:
        endpoints: '[{"url": "https://127.0.0.1:8002/browser/api/v1/health", "name": "sm-kms-postgresql-1"}, {"url": "https://127.0.0.1:8003/browser/api/v1/health", "name": "sm-kms-postgresql-2"}]'

    - name: Verify authenticated PostgreSQL service readiness
      run: |
        set -euo pipefail
        docker compose --profile postgres -f ./deployments/sm-kms/compose.yml exec -T sm-kms-app-postgresql-1 \
          /app/sm-kms readyz --url https://127.0.0.1:9090 \
          --cacert /certs/issuing-ca.pem \
          --cert /certs/sm-kms/private-https-mutual-entity-sm-kms-postgres-1/private-https-mutual-entity-sm-kms-postgres-1.crt \
          --key /certs/sm-kms/private-https-mutual-entity-sm-kms-postgres-1/private-https-mutual-entity-sm-kms-postgres-1.key
        docker compose --profile postgres -f ./deployments/sm-kms/compose.yml exec -T sm-kms-app-postgresql-2 \
          /app/sm-kms readyz --url https://127.0.0.1:9090 \
          --cacert /certs/issuing-ca.pem \
          --cert /certs/sm-kms/private-https-mutual-entity-sm-kms-postgres-2/private-https-mutual-entity-sm-kms-postgres-2.crt \
          --key /certs/sm-kms/private-https-mutual-entity-sm-kms-postgres-2/private-https-mutual-entity-sm-kms-postgres-2.key

    - name: Set load test parameters
      id: load-params
      env:
        LOAD_PROFILE: ${{ env.LOAD_PROFILE }}
        VIRTUAL_CLIENTS_OVERRIDE: ${{ env.VIRTUAL_CLIENTS_OVERRIDE }}
        DURATION_OVERRIDE: ${{ env.DURATION_OVERRIDE }}
      run: |
        set -euo pipefail
        echo "⚙️ Setting load test parameters..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        case "$LOAD_PROFILE" in
          quick)
            CLIENTS=10
            DURATION=30
            ;;
          standard)
            CLIENTS=50
            DURATION=120
            ;;
          stress)
            CLIENTS=200
            DURATION=300
            ;;
          complete)
            CLIENTS=1
            DURATION=60
            ;;
          *)
            echo "❌ Invalid load profile: $LOAD_PROFILE" >&2
            exit 1
            ;;
        esac

        validate_override() {
          local name="$1"
          local value="$2"
          local maximum="$3"
          local normalized

          if [[ ! "$value" =~ ^[0-9]+$ ]]; then
            echo "❌ $name must contain only decimal digits; received: $value" >&2
            return 1
          fi

          normalized="${value#"${value%%[!0]*}"}"
          if [[ -z "$normalized" ]]; then
            normalized=0
          fi

          if (( ${#normalized} > ${#maximum} )); then
            echo "❌ $name must be 0 or between 1 and $maximum; received: $value" >&2
            return 1
          fi
          if (( 10#$normalized > 10#$maximum )); then
            echo "❌ $name must be 0 or between 1 and $maximum; received: $value" >&2
            return 1
          fi

          printf '%s' "$normalized"
        }

        CLIENTS_OVERRIDE="$(validate_override 'virtual_clients' "$VIRTUAL_CLIENTS_OVERRIDE" 200)"
        DURATION_OVERRIDE_VALIDATED="$(validate_override 'duration_seconds' "$DURATION_OVERRIDE" 300)"
        if [[ "$CLIENTS_OVERRIDE" != "0" ]]; then
          CLIENTS="$CLIENTS_OVERRIDE"
        fi
        if [[ "$DURATION_OVERRIDE_VALIDATED" != "0" ]]; then
          DURATION="$DURATION_OVERRIDE_VALIDATED"
        fi

        printf 'virtual_clients=%s\n' "$CLIENTS" >> "$GITHUB_OUTPUT"
        printf 'duration=%s\n' "$DURATION" >> "$GITHUB_OUTPUT"

        echo "📊 Load test configuration:"
        echo "  Profile: $LOAD_PROFILE"
        echo "  Virtual Clients: $CLIENTS"
        echo "  Duration: ${DURATION}s"
        END_TIME=$(date +%s)
        ELAPSED_SECONDS=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Load test parameter configuration completed in: ${ELAPSED_SECONDS}s"
    - name: Start infrastructure monitoring
      run: |
        echo "📊 Starting infrastructure monitoring..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        # Create monitoring directory
        mkdir -p ./load-reports/infrastructure

        # Start background monitoring process
        {
          while true; do
            # Use filesystem-safe timestamp format (no colons for GitHub Actions artifact compatibility)
            TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")

            # Collect Docker stats
            docker stats --no-stream --format "table {{.Container}},{{.CPUPerc}},{{.MemUsage}},{{.MemPerc}},{{.NetIO}},{{.BlockIO}}" > "./load-reports/infrastructure/docker-stats-$TIMESTAMP.csv"

            # Collect system metrics (use ISO 8601 timestamp in CSV content, not filename)
            {
              echo "timestamp,metric,value"
              TIMESTAMP_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              echo "$TIMESTAMP_ISO,cpu_percent,$(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1}')"
              echo "$TIMESTAMP_ISO,mem_used_mb,$(free -m | awk 'NR==2{print $3}')"
              echo "$TIMESTAMP_ISO,mem_total_mb,$(free -m | awk 'NR==2{print $2}')"
              echo "$TIMESTAMP_ISO,disk_used_percent,$(df -h / | awk 'NR==2{print $5}' | sed 's/%//')"
            } >> "./load-reports/infrastructure/system-metrics.csv"

            sleep 5
          done
        } &

        MONITOR_PID=$!
        echo "MONITOR_PID=$MONITOR_PID" >> $GITHUB_ENV
        echo "✅ Infrastructure monitoring started (PID: $MONITOR_PID)"
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Infrastructure monitoring startup completed in: ${DURATION}s"

    - name: Run Gatling load tests
      continue-on-error: ${{ github.event_name == 'pull_request' && env.LOAD_PROFILE != 'complete' }}
      working-directory: ./test/load
      env:
        LOAD_PROFILE: ${{ env.LOAD_PROFILE }}
        LOAD_VIRTUAL_CLIENTS: ${{ steps.load-params.outputs.virtual_clients }}
        LOAD_DURATION: ${{ steps.load-params.outputs.duration }}
      run: |
        echo "🚀 Running Gatling load tests..."
        echo "ℹ️ Crypto scenarios register and authenticate a unique service user before API requests."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        # Set environment variable to help with debugging
        export LOAD_DEBUG=1

        # Configure JVM options for Gatling
        export MAVEN_OPTS="-Xmx2g -Xms1g"

        # Run ServiceApiSimulation only (BrowserApiSimulation targets identity OAuth endpoints not available on sm-kms)
        if ./mvnw gatling:test \
          -Dgatling.simulationClass=cryptoutil.ServiceApiSimulation \
          "-Dprofile=$LOAD_PROFILE" \
          -Dport=8002 \
          "-Dvirtualclients=$LOAD_VIRTUAL_CLIENTS" \
          "-DdurationSeconds=$LOAD_DURATION" \
          "-Dgatling.runDescription=CI Load Test - Profile: $LOAD_PROFILE"; then
          echo "✅ Gatling load tests completed successfully"
        else
          echo "❌ Gatling load tests failed"
          exit 1
        fi
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Gatling load tests completed in: ${DURATION}s"

    - name: Stop infrastructure monitoring
      if: always()
      run: |
        echo "🛑 Stopping infrastructure monitoring..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        if [ ! -z "$MONITOR_PID" ]; then
          echo "🛑 Stopping infrastructure monitoring (PID: $MONITOR_PID)..."
          kill $MONITOR_PID 2>/dev/null || true
          wait $MONITOR_PID 2>/dev/null || true
          echo "✅ Infrastructure monitoring stopped"
        fi
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Infrastructure monitoring shutdown completed in: ${DURATION}s"

    - name: Collect service logs
      if: always()
      run: |
        echo "📋 Collecting service logs..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        mkdir -p ./load-reports/service-logs

        # Collect logs from all cryptoutil services
        (cd ./deployments/sm-kms && docker compose -f compose.yml logs sm-kms-app-postgresql-1) > ./load-reports/service-logs/sm-kms-postgresql-1.log 2>&1 || true
        (cd ./deployments/sm-kms && docker compose -f compose.yml logs sm-kms-app-postgresql-2) > ./load-reports/service-logs/sm-kms-postgresql-2.log 2>&1 || true
        (cd ./deployments/sm-kms && docker compose -f compose.yml logs sm-kms-db-postgres-1) > ./load-reports/service-logs/postgres.log 2>&1 || true
        (cd ./deployments/sm-kms && docker compose -f compose.yml logs opentelemetry-collector-contrib) > ./load-reports/service-logs/otel-collector.log 2>&1 || true

        echo "✅ Service logs collected"
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Service log collection completed in: ${DURATION}s"

    - name: Generate load test summary
      if: always()
      env:
        LOAD_PROFILE: ${{ env.LOAD_PROFILE }}
        LOAD_VIRTUAL_CLIENTS: ${{ steps.load-params.outputs.virtual_clients }}
        LOAD_DURATION: ${{ steps.load-params.outputs.duration }}
        TRIGGERED_BY: ${{ github.event_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        echo "📊 Generating load test summary..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        {
          printf '# Load Test Summary\n\n'
          printf '**Profile:** %s\n' "$LOAD_PROFILE"
          printf '**Virtual Clients:** %s\n' "$LOAD_VIRTUAL_CLIENTS"
          printf '**Duration:** %ss\n' "$LOAD_DURATION"
          printf '**Triggered by:** %s\n' "$TRIGGERED_BY"
          printf '**Workflow Run:** %s\n\n' "$RUN_URL"
          printf '## Test Configuration\n\n'
          printf '| Parameter | Value |\n'
          printf '|-----------|-------|\n'
          printf '| Load Profile | %s |\n' "$LOAD_PROFILE"
          printf '| Virtual Clients | %s |\n' "$LOAD_VIRTUAL_CLIENTS"
          printf '| Test Duration | %ss |\n' "$LOAD_DURATION"
          printf '| Target Services | sm-kms-postgresql-1, sm-kms-postgresql-2 |\n\n'
          printf '## Services Tested\n\n'
          printf '%s\n' '- **sm-kms-postgresql-1** - https://127.0.0.1:8002/service/api/v1'
          printf '%s\n\n' '- **sm-kms-postgresql-2** - https://127.0.0.1:8003/service/api/v1'
          printf '## Artifacts Generated\n\n'
          printf '%s\n' '- Gatling HTML reports: `test/load/target/gatling/`'
          printf '%s\n' '- Infrastructure metrics: `load-reports/infrastructure/`'
          printf '%s\n\n' '- Service logs: `load-reports/service-logs/`'
          printf '## Results\n\n'
          printf '%s\n' 'See Gatling HTML reports in artifacts for detailed performance analysis.'
        } > ./load-reports/load-test-summary.md

        echo "✅ Load test summary generated"
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Load test summary generation completed in: ${DURATION}s"

    - name: Stop services
      if: always()
      uses: ./.github/actions/docker-compose-down
      with:
        compose-file: './deployments/sm-kms/compose.yml'

    - name: Upload infrastructure metrics
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: infrastructure-metrics-${{ env.LOAD_PROFILE }}
        path: load-reports/infrastructure/
        retention-days: 1

    - name: Upload Gatling HTML reports
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: gatling-reports-${{ env.LOAD_PROFILE }}
        path: test/load/target/gatling/
        retention-days: 1

    - name: Upload JaCoCo coverage report
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: jacoco-coverage-report-${{ env.LOAD_PROFILE }}
        path: test/load/target/site/jacoco/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload service logs
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: service-logs-${{ env.LOAD_PROFILE }}
        path: load-reports/service-logs/
        retention-days: 1

    - name: Upload load test summary
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: load-test-summary-${{ env.LOAD_PROFILE }}
        path: load-reports/load-test-summary.md
        retention-days: 1

    - name: Load test summary
      if: always()
      run: |
        echo "## 🚀 Load Testing Results" >> $GITHUB_STEP_SUMMARY
        cat ./load-reports/load-test-summary.md >> $GITHUB_STEP_SUMMARY

    - name: Load summary
      if: always()
      uses: ./.github/actions/workflow-job-end
