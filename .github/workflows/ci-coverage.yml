# $schema: https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# WORKFLOW: CI - Coverage Collection
# PURPOSE: Enforce per-package coverage targets and report aggregate coverage trends
# DEPENDENCIES: None (runs independently without external services)
# EXPECTED DURATION: 5-6 minutes (matrix parallel execution across 4-6 package groups)
# TIMEOUT: 20 minutes (allows for parallel test execution with retry overhead)
# CRITICAL PATH: Test execution for largest packages (kms, identity, jose)
# OPTIMIZATION: Uses matrix strategy for package-level parallelization

name: CI - Coverage Collection
# CROSS-PLATFORM COMPATIBILITY: All file references in this workflow MUST use relative paths
# to support both GitHub Actions Ubuntu runners and Windows `act` local runner testing.
# Absolute paths (e.g., C:\...) break cross-platform compatibility.
# Example: Use './deployments/cryptoutil/compose.yml'

on:
  push:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with pull_request below
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  pull_request:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with push above
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  workflow_dispatch:

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_NAME: cryptoutil_test
  POSTGRES_USER: cryptoutil
  POSTGRES_PASS: cryptoutil_test_password

jobs:
  coverage:
    name: Coverage Collection
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{ env.POSTGRES_NAME }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASS }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - name: Checkout code
      # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
      uses: actions/checkout@v6.0.2
      with:
        sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

    - name: Begin Workflow Job
      id: begin-workflow-job
      uses: ./.github/actions/workflow-job-begin

    - name: Set up Go and validate dependencies
      uses: ./.github/actions/go-setup
      with:
        go-version: ${{ steps.begin-workflow-job.outputs.go-version }}
        go-mod-download: true
        go-mod-verify: true
        go-mod-tidy: true

    - name: Run coverage on tests
      working-directory: .
      run: |
        set -euo pipefail
        echo "::group::go test with coverage"
        mkdir -p workflow-reports/coverage
        if ! PACKAGE_INVENTORY=$(go list ./...); then
          echo "Failed to generate the coverage package inventory"
          exit 1
        fi
        if ! MODULE_PATH=$(go list -m); then
          echo "Failed to determine the Go module path for inventory classification"
          exit 1
        fi
        if [[ -z "$MODULE_PATH" ]]; then
          echo "Go module path is empty"
          exit 1
        fi
        if [[ -z "${PACKAGE_INVENTORY//[[:space:]]/}" ]]; then
          echo "Coverage package inventory is empty"
          exit 1
        fi
        PACKAGES=()
        while IFS= read -r PKG; do
          if [[ -z "$PKG" ]]; then
            echo "Coverage package inventory contains an empty entry"
            exit 1
          fi
          case "$PKG" in
            "$MODULE_PATH"/cmd|"$MODULE_PATH"/cmd/*) continue ;;
          esac
          PACKAGES+=("$PKG")
        done <<< "$PACKAGE_INVENTORY"
        if ((${#PACKAGES[@]} == 0)); then
          echo "Coverage package inventory is empty after exclusions"
          exit 1
        fi
        printf '%s\n' "${PACKAGES[@]}" > workflow-reports/coverage/package-inventory.txt
        go test -count=1 -p=2 -coverprofile=workflow-reports/coverage/coverage.out -covermode=atomic \
          "${PACKAGES[@]}" 2>&1 | tee workflow-reports/coverage/coverage-per-pkg.txt
        echo "::endgroup::"

    - name: Generate coverage report
      run: go tool cover -html=workflow-reports/coverage/coverage.out -o workflow-reports/coverage/coverage.html

    - name: Generate function-level coverage report
      run: go tool cover -func=workflow-reports/coverage/coverage.out > workflow-reports/coverage/coverage-func.txt

    - name: Enforce per-package coverage threshold
      run: |
        set -euo pipefail
        if ! MODULE_PATH=$(go list -m); then
          echo "Failed to determine the Go module path for inventory classification"
          exit 1
        fi
        if [[ -z "$MODULE_PATH" ]]; then
          echo "Go module path is empty"
          exit 1
        fi
        echo "## Per-Package Coverage Enforcement" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Package | Coverage | Status |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
        if ! awk -v summary="$GITHUB_STEP_SUMMARY" -v module="$MODULE_PATH" '
          function fail(message) {
            print "ERROR: " message
            failed = 1
          }
          BEGIN {
            category_count = 3
            category_name[1] = "internal/apps-tools"
            category_name[2] = "internal/shared"
            category_name[3] = "internal/apps-framework"
            category_expected[1] = 166
            category_expected[2] = 29
            category_expected[3] = 44
            expected_total_count = 352
            expected_root_pkg_count = 0
            expected_no_statement_count = 1
            no_statement_package = module "/internal/apps/identity-authz/e2e"
            root_pkg_prefix = module "/pkg"
          }
          FILENAME == ARGV[1] {
            if (NF != 1) {
              fail("Malformed coverage package inventory at line " FNR)
              next
            }
            if ($1 in expected) {
              fail("Duplicate coverage package inventory entry: " $1)
              next
            }
            expected[$1] = 1
            expected_count++
            for (i = 1; i <= category_count; i++) {
              if ($1 ~ ("/" category_name[i] "(/|$)")) category_inventory[i]++
            }
            if ($1 == root_pkg_prefix || index($1, root_pkg_prefix "/") == 1) root_pkg_inventory++
            next
          }
          ($1 == "ok" || $1 == "?") {
            pkg = $2
            if (!(pkg in expected)) {
              fail("Test output contains package absent from inventory: " pkg)
              next
            }
            if (pkg in seen) {
              fail("Duplicate test result for package: " pkg)
              next
            }
            seen[pkg] = 1
            if ($4 == "coverage:" && $5 == "[no" && $6 == "statements]") {
              if (pkg != no_statement_package) {
                fail("Unexpected package with no statements: " pkg)
              } else {
                no_statement_count++
              }
              next
            }
            if ($1 == "?") {
              if ($3 != "[no" || $4 != "test" || $5 != "files]") {
                fail("Malformed no-test-files result for package: " pkg)
              } else {
                no_test_count++
              }
              next
            }
            if ($4 != "coverage:" || $5 !~ /^[0-9]+([.][0-9]+)?%$/ || $6 != "of" || $7 != "statements") {
              fail("Malformed coverage result for package: " pkg)
              next
            }
            pct = $5
            sub(/%$/, "", pct)
            threshold = 95.0
            for (i = 1; i <= category_count; i++) {
              if (pkg ~ ("/" category_name[i] "(/|$)")) threshold = 98.0
            }
            if (pkg == root_pkg_prefix || index(pkg, root_pkg_prefix "/") == 1) threshold = 98.0
            status = "PASS"
            if ((pct + 0) < threshold) {
              status = "FAIL"
              failed = 1
            }
            printf "| `%s` | %s%% | %s (min %.1f%%) |\n", pkg, pct, status, threshold >> summary
            coverage_count++
          }
          END {
            if (expected_count == 0) fail("Coverage package inventory is empty")
            if (expected_count != expected_total_count) {
              fail("Coverage package inventory count changed: expected " expected_total_count ", got " expected_count)
            }
            for (i = 1; i <= category_count; i++) {
              if (category_inventory[i] != category_expected[i]) {
                fail("Coverage package count changed for " category_name[i] ": expected " category_expected[i] ", got " category_inventory[i])
              }
            }
            if (root_pkg_inventory != expected_root_pkg_count) {
              fail("Top-level pkg namespace count changed: expected " expected_root_pkg_count ", got " root_pkg_inventory "; update the explicit inventory baseline")
            }
            if (no_statement_count != expected_no_statement_count) {
              fail("No-statement package count changed: expected " expected_no_statement_count ", got " no_statement_count)
            }
            for (pkg in expected) {
              if (!(pkg in seen)) fail("Missing test result for inventoried package: " pkg)
            }
            if (coverage_count == 0) fail("No package coverage rows were parsed")
            if (failed) {
              print "Per-package coverage gate failed; see table above for details"
              exit 1
            }
            print "All packages meet per-package coverage thresholds (" no_test_count " packages have no test files)"
          }
        ' workflow-reports/coverage/package-inventory.txt workflow-reports/coverage/coverage-per-pkg.txt; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Per-package coverage gate failed; see step logs for details." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Scan coverage artifacts for vulnerabilities
      uses: ./.github/actions/security-scan-trivy2
      with:
        scan-name: 'coverage'
        scan-type: 'fs'
        scan-ref: 'workflow-reports/coverage'
        trivy-sarif-output: 'coverage-upload-artifacts-trivy.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'

    - name: Display function-level coverage
      run: |
        echo "## 📊 Function-Level Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat workflow-reports/coverage/coverage-func.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Calculate aggregate coverage trend (informational)
      id: coverage-trend
      run: |
        set -euo pipefail
        # Aggregate coverage is informational; package-level checks above enforce policy.
        if ! CURRENT_COVERAGE=$(awk '
          function fail(message) {
            print "ERROR: " message > "/dev/stderr"
            invalid = 1
          }
          $1 == "total:" && $2 == "(statements)" {
            if (total_count != 0) {
              fail("duplicate aggregate coverage total")
              next
            }
            if (NF != 3 || $3 !~ /^[0-9]+([.][0-9]+)?%$/) {
              fail("malformed aggregate coverage total at line " FNR)
              next
            }
            coverage = $3
            sub(/%$/, "", coverage)
            total_count++
          }
          END {
            if (total_count != 1) fail("aggregate coverage total is missing")
            if (invalid) exit 1
            print coverage
          }
        ' workflow-reports/coverage/coverage-func.txt); then
          echo "Failed to parse aggregate coverage output"
          exit 1
        fi
        echo "current_coverage=$CURRENT_COVERAGE" >> $GITHUB_OUTPUT
        echo "📋 Aggregate statement coverage (informational): ${CURRENT_COVERAGE}%"

        # Try to download previous coverage data
        PREVIOUS_COVERAGE="baseline"
        TREND_INDICATOR="📊"
        TREND_TEXT="baseline"

        if [ -f workflow-reports/coverage/previous-coverage.txt ]; then
          PREVIOUS_COVERAGE=$(cat workflow-reports/coverage/previous-coverage.txt)
          echo "📈 Previous coverage: ${PREVIOUS_COVERAGE}%"

          # Calculate difference using bc for floating point math
          DIFF=$(echo "$CURRENT_COVERAGE - $PREVIOUS_COVERAGE" | bc)

          # Determine trend indicator
          if (( $(echo "$DIFF > 0.1" | bc -l) )); then
            TREND_INDICATOR="📈"
            TREND_TEXT="increased"
          elif (( $(echo "$DIFF < -0.1" | bc -l) )); then
            TREND_INDICATOR="📉"
            TREND_TEXT="decreased"
          else
            TREND_INDICATOR="➡️"
            TREND_TEXT="unchanged"
          fi

          echo "trend_indicator=$TREND_INDICATOR" >> $GITHUB_OUTPUT
          echo "trend_text=$TREND_TEXT" >> $GITHUB_OUTPUT
          echo "coverage_diff=$DIFF" >> $GITHUB_OUTPUT
          echo "previous_coverage=$PREVIOUS_COVERAGE" >> $GITHUB_OUTPUT

          echo "$TREND_INDICATOR Coverage $TREND_TEXT: ${CURRENT_COVERAGE}% (${DIFF:+${DIFF}%})"
        else
          echo "trend_indicator=$TREND_INDICATOR" >> $GITHUB_OUTPUT
          echo "trend_text=$TREND_TEXT" >> $GITHUB_OUTPUT
          echo "coverage_diff=0.0" >> $GITHUB_OUTPUT
          echo "previous_coverage=0.0" >> $GITHUB_OUTPUT
          echo "$TREND_INDICATOR Coverage baseline: ${CURRENT_COVERAGE}%"
        fi

        # Store current coverage for next run
        echo "$CURRENT_COVERAGE" > workflow-reports/coverage/current-coverage.txt

    - name: Download previous coverage data
      # https://github.com/actions/download-artifact/releases (v4.3.0, 2025-04-21)
      uses: actions/download-artifact@v6.0.0
      continue-on-error: true
      with:
        name: coverage-trend-data
        path: workflow-reports/coverage/

    - name: Display coverage trend
      run: |
        echo "## 📈 Aggregate Coverage Trend (Informational)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Aggregate Statement Coverage (informational; not a gate) | ${{ steps.coverage-trend.outputs.current_coverage }}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Policy Enforcement | Per-package thresholds above: 95% default / 98% internal/apps-tools, internal/shared, internal/apps-framework, and root pkg packages |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.coverage-trend.outputs.trend_text }}" != "baseline" ]; then
          echo "| Previous Coverage | ${{ steps.coverage-trend.outputs.previous_coverage }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Trend | ${{ steps.coverage-trend.outputs.trend_indicator }} ${{ steps.coverage-trend.outputs.trend_text }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Difference | ${{ steps.coverage-trend.outputs.coverage_diff }}% |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Trend | ${{ steps.coverage-trend.outputs.trend_indicator }} ${{ steps.coverage-trend.outputs.trend_text }} |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage
      # https://github.com/codecov/codecov-action/releases (v5.5.1, 2025-11-15)
      uses: codecov/codecov-action@v5.5.1
      with:
        files: ./workflow-reports/coverage/coverage.out
        flags: coverage-tests  # Group uploads under "coverage-tests"
        name: codecov-coverage
        fail_ci_if_error: false

    - name: Upload coverage artifacts
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: coverage-reports
        path: |
          workflow-reports/coverage/coverage.out
          workflow-reports/coverage/coverage.html
          workflow-reports/coverage/coverage-func.txt
          workflow-reports/coverage/coverage-per-pkg.txt
          coverage-upload-artifacts-trivy.sarif
        retention-days: 1

    - name: Upload coverage trend data for next run
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      if: always()
      with:
        name: coverage-trend-data
        path: workflow-reports/coverage/current-coverage.txt
        retention-days: 7

    - name: Coverage test summary
      uses: ./.github/actions/workflow-job-end
