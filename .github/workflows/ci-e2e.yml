# $schema: https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# WORKFLOW: End-to-End Testing
# PURPOSE: E2E integration tests with full Docker Compose stack (cryptoutil services + dependencies)
# DEPENDENCIES: Docker Compose stack (cryptoutil-sqlite/postgres, PostgreSQL, OTEL collector)
# EXPECTED DURATION: 5-10min (Docker Compose startup + Go E2E test execution)
# TIMEOUT: 30min (allows Docker image builds + stack startup + E2E tests + shared CPU latency)
# CRITICAL PATH: Docker Compose stack startup (60-150s latency hiding strategies) + Go test execution

name: CI - End-to-End Testing
# CROSS-PLATFORM COMPATIBILITY: All file references in this workflow MUST use relative paths
# to support both GitHub Actions Ubuntu runners and Windows `act` local runner testing.
# Absolute paths (e.g., C:\...) break cross-platform compatibility.
# Example: Use './deployments/sm-kms/compose.yml'

on:
  push:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with pull_request below
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  pull_request:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with push above
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  workflow_dispatch:

jobs:
  # End-to-End Testing - Full system validation with Docker Compose
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
      uses: actions/checkout@v6.0.2
      with:
        sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

    - name: Begin Workflow Job
      id: begin-workflow-job
      uses: ./.github/actions/workflow-job-begin

    - name: Set up Go and validate dependencies
      uses: ./.github/actions/go-setup
      with:
        go-version: ${{ steps.begin-workflow-job.outputs.go-version }}
        go-mod-download: true
        go-mod-verify: true
        go-mod-tidy: true

    - name: Pre-pull Docker images (parallel)
      uses: ./.github/actions/docker-images-pull
      with:
        images: |
          golang:1.27.3
          postgres:latest
          alpine:latest
          otel/opentelemetry-collector-contrib:latest
          grafana/otel-lgtm:latest

    - name: Build Docker images
      uses: ./.github/actions/docker-compose-build

    - name: Deploy SM services
      uses: ./.github/actions/docker-compose-up
      with:
        compose-file: './deployments/sm/compose.yml'
        required-completed-services: >-
          ["healthcheck-secrets", "builder-sm-kms", "validate-secrets-sm-kms", "pki-init", "otel-certs-init", "healthcheck-opentelemetry-collector-contrib"]

    - name: Verify SM services with admin and public mTLS
      working-directory: ./deployments/sm
      run: |
        set -euo pipefail

        wait_for_admin_ready() {
          local service="$1"
          local identity="$2"
          local cert="/certs/sm-kms/private-https-mutual-entity-${identity}/private-https-mutual-entity-${identity}.crt"
          local key="/certs/sm-kms/private-https-mutual-entity-${identity}/private-https-mutual-entity-${identity}.key"

          echo "Waiting for authenticated admin readiness: ${service}"
          timeout 180s bash -euo pipefail -c '
            service="$1"
            cert="$2"
            key="$3"
            until docker compose --file compose.yml exec -T "$service" \
              /app/sm-kms readyz --cacert /certs/issuing-ca.pem --cert "$cert" --key "$key" \
              >/dev/null 2>&1; do
              sleep 2
            done
          ' _ "$service" "$cert" "$key"
          echo "${service} admin mTLS ready."
        }

        wait_for_public_ready() {
          local service="$1"
          local suffix="$2"
          local identity="public-https-client-entity-sm-kms-${suffix}"
          local cert="/certs/sm-kms/${identity}/${identity}.crt"
          local key="/certs/sm-kms/${identity}/${identity}.key"
          local ca="/certs/sm-kms/public-https-server-issuing-ca/truststore/public-https-server-issuing-ca.crt"

          echo "Waiting for verified public mTLS readiness: ${service}"
          timeout 180s bash -euo pipefail -c '
            service="$1"
            cert="$2"
            key="$3"
            ca="$4"
            until docker compose --file compose.yml exec -T "$service" \
              /app/sm-kms health --url https://127.0.0.1:8080/service/api/v1/health \
              --cacert "$ca" --cert "$cert" --key "$key" \
              >/dev/null 2>&1; do
              sleep 2
            done
          ' _ "$service" "$cert" "$key" "$ca"
          echo "${service} public mTLS health verified."
        }

        wait_for_admin_ready sm-kms-app-sqlite-1 sm-kms-sqlite-1
        wait_for_admin_ready sm-kms-app-sqlite-2 sm-kms-sqlite-2
        wait_for_admin_ready sm-kms-app-postgresql-1 sm-kms-postgres-1
        wait_for_admin_ready sm-kms-app-postgresql-2 sm-kms-postgres-2

        wait_for_public_ready sm-kms-app-sqlite-1 sqlite-1-serviceuser-db
        wait_for_public_ready sm-kms-app-sqlite-2 sqlite-2-serviceuser-db
        wait_for_public_ready sm-kms-app-postgresql-1 postgres-serviceuser-db
        wait_for_public_ready sm-kms-app-postgresql-2 postgres-serviceuser-db

    - name: Run E2E tests
      run: |
        echo "🧪 Running end-to-end tests..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        # Stop SM services to free ports for E2E tests
        echo "🛑 Stopping CA and SM services to free ports..."
        (cd ./deployments/sm && docker compose -f compose.yml down -v)

        # Product pki-init preserves UID 65532 in the host certificate bind mount.
        sudo chown -R "$(id -u):$(id -g)" ./deployments/sm-kms/certs

        # Set environment variable to help with debugging
        export E2E_DEBUG=1

        # Run the tests and capture output
        # Test sm-kms E2E
        if go test -tags=e2e -v -timeout=30m ./internal/apps/sm-kms/e2e/... 2>&1; then
          echo "✅ sm-kms E2E tests completed successfully"
        else
          echo "❌ sm-kms E2E tests failed"
          exit 1
        fi

        # Test skeleton-template E2E
        if go test -tags=e2e -v -timeout=30m ./internal/apps/skeleton-template/e2e/... 2>&1; then
          echo "✅ skeleton-template E2E tests completed successfully"
        else
          echo "❌ skeleton-template E2E tests failed"
          exit 1
        fi

        # TODO: Enable identity E2E tests after identity services migrated to service-framework pattern
        # Currently DISABLED - identity-authz, identity-idp, identity-rp, identity-rs, identity-spa not yet migrated
        # Test identity E2E
        # if go test -tags=e2e -v -timeout=30m ./internal/apps/identity/e2e/... 2>&1; then
        #   echo "✅ identity E2E tests completed successfully"
        # else
        #   echo "❌ identity E2E tests failed"
        #   exit 1
        # fi

        echo "⚠️  Identity E2E tests SKIPPED - awaiting service-framework migration"

        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ E2E tests completed in: ${DURATION}s"

    - name: Collect service logs
      if: always()
      run: |
        echo "📋 Collecting service logs..."
        START_TIME=$(date +%s)
        echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        mkdir -p ./workflow-reports/e2e

        # Collect logs from all cryptoutil services
          (cd ./deployments/sm && docker compose -f compose.yml logs sm-kms-app-sqlite-1) > ./workflow-reports/e2e/sm-kms-sqlite.log 2>&1 || true
          (cd ./deployments/sm && docker compose -f compose.yml logs sm-kms-app-postgresql-1) > ./workflow-reports/e2e/sm-kms-postgresql-1.log 2>&1 || true
          (cd ./deployments/sm && docker compose -f compose.yml logs sm-kms-app-postgresql-2) > ./workflow-reports/e2e/sm-kms-postgresql-2.log 2>&1 || true
          (cd ./deployments/sm && docker compose -f compose.yml logs postgres-leader) > ./workflow-reports/e2e/sm-kms-db-postgres.log 2>&1 || true
          (cd ./deployments/sm && docker compose -f compose.yml logs opentelemetry-collector-contrib) > ./workflow-reports/e2e/otel-collector.log 2>&1 || true
          (cd ./deployments/sm && docker compose -f compose.yml logs healthcheck-opentelemetry-collector-contrib) > ./workflow-reports/e2e/otel-healthcheck.log 2>&1 || true

        # Collect SM service logs
          (cd ./deployments/sm && docker compose -f compose.yml logs sm-kms-app-sqlite-1) > ./workflow-reports/e2e/sm-kms.log 2>&1 || true
        echo "✅ Service logs collected"
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️ Service log collection completed in: ${DURATION}s"

    - name: Display container logs
      if: always()
      uses: ./.github/actions/docker-compose-logs
      with:
        log-directory: ./workflow-reports/e2e

    - name: Upload container logs
      if: always()
      # https://github.com/actions/upload-artifact/releases (v5.0.0, 2025-04-21)
      uses: actions/upload-artifact@v5.0.0
      with:
        name: e2e-container-logs-${{ github.run_id }}
        path: ./workflow-reports/e2e/
        if-no-files-found: ignore
        retention-days: 1

    - name: E2E test summary
      if: always()
      uses: ./.github/actions/workflow-job-end

    - name: Stop services
      if: always()
      run: |
        echo "🛑 Stopping all services..."
          (cd ./deployments/sm-kms && docker compose -f compose.yml down -v --remove-orphans) || true
          (cd ./deployments/sm && docker compose -f compose.yml down -v --remove-orphans) || true
          echo "✅ All services stopped"
