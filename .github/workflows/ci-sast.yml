# $schema: https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# WORKFLOW: CI - SAST Security Analysis
# PURPOSE: Static application security testing with gosec, upload SARIF to GitHub Security tab
# DEPENDENCIES: None (runs independently without external services)
# EXPECTED DURATION: 3-4 minutes (gosec analysis + SARIF upload)
# TIMEOUT: 15 minutes (generous for GitHub Actions shared CPU + SARIF processing)
# CRITICAL PATH: gosec security scanning
name: CI - SAST Security Testing
# CROSS-PLATFORM COMPATIBILITY: All file references in this workflow MUST use relative paths
# to support both GitHub Actions Ubuntu runners and Windows `act` local runner testing.
# Absolute paths (e.g., C:\...) break cross-platform compatibility.
# Example: Use './deployments/cryptoutil/compose.yml'

# Covers: Go, JavaScript (embedded + shell scripts), Java
# Jobs: security (Staticcheck, Govulncheck, Trivy), codeql (multi-language analysis)

on:
  push:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with pull_request below
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  pull_request:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION - Keep synchronized with push above
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  workflow_dispatch:

jobs:
  # Java SAST Analysis
  # Dedicated Java security analysis for load testing code
  # Tools: SpotBugs (with FindSecBugs), OWASP Dependency Check, License Check, Versions Check
  java-sast:
    name: Java SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

      - name: Begin Workflow Job
        id: begin-workflow-job
        uses: ./.github/actions/workflow-job-begin

      - name: Set up Java
        # https://github.com/actions/setup-java/releases (v5.0.0, 2025-04-21)
        uses: actions/setup-java@v5.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # SpotBugs Static Analysis with FindSecBugs
      - name: Run SpotBugs Security Analysis
        run: |
          echo "🔍 Running SpotBugs security analysis with FindSecBugs..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cd test/load
          # Ensure mvnw is executable and run plugin locally
          chmod +x ./mvnw || true
          ./mvnw spotbugs:check -Dspotbugs.skip=false
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ SpotBugs analysis completed in: ${DURATION}s"

      # OWASP Dependency Check
      - name: Check effective maven plugin config for dependency-check (diagnostic)
        run: |
          echo "🔍 Checking effective pom for dependency-check plugin config (no secrets will be printed):"
          cd test/load
          chmod +x ./mvnw || true
          # Output the effective pom (plugin configuration should show ${env.NVD_API_KEY} if present in plugin config)
          ./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:effective-pom -Doutput=effective-pom.xml || true
          grep -n "nvdApiKey" effective-pom.xml || echo "ℹ️ nvdApiKey not configured in effective POM"

      - name: Cache dependency-check data
        # https://github.com/actions/cache/releases (v4.3.0, 2025-04-18)
        uses: actions/cache@v4.3.0
        with:
          path: test/load/target/dependency-check/data
          key: ${{ runner.os }}-dependency-check-data-${{ hashFiles('test/load/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-data-

      - name: Update NVD data (dependency-check update-only)
        # Inject NVD API key securely from repository secrets. If not defined, the step runs without the key.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "🔄 Updating NVD data for dependency-check (update-only)..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cd test/load
          chmod +x ./mvnw || true
          EXTRA_ARGS=""
          if [ -n "${NVD_API_KEY}" ]; then
            EXTRA_ARGS="-DnvdApiKey=${NVD_API_KEY} -Dnvd.apiKey=${NVD_API_KEY}"
          fi
          # Pass explicit H2 connectionString so the plugin uses project-local DB and doesn't default to ~/.m2
          ./mvnw org.owasp:dependency-check-maven:update-only $EXTRA_ARGS -Ddependency-check.dataDirectory=${{ github.workspace }}/test/load/target/dependency-check/data "-Ddependency-check.connectionString=jdbc:h2:file:${{ github.workspace }}/test/load/target/dependency-check/data/dependency-check-db;DB_CLOSE_ON_EXIT=FALSE"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ NVD update-only completed in: ${DURATION}s"

      - name: Show dependency-check data directory (debug)
        run: |
          echo "Dependency-check data dir contents:"
          ls -la test/load/target/dependency-check || true
          echo "Size summary (if du available):"
          if command -v du >/dev/null 2>&1; then du -sh test/load/target/dependency-check || true; fi

      - name: Verify H2 database exists before check
        run: |
          echo "🔍 Verifying H2 database was populated by update-only step..."
          DB_FILE="test/load/target/dependency-check/data/dependency-check-db.mv.db"
          if [ -f "$DB_FILE" ]; then
            DB_SIZE=$(du -h "$DB_FILE" | cut -f1)
            echo "✅ Database file exists: $DB_SIZE"
          else
            echo "::error::❌ Database file not found at $DB_FILE"
            echo "::error::The update-only step may have failed to populate the NVD database."
            echo "::error::Check the update-only step logs for errors."
            exit 1
          fi

      - name: Run OWASP Dependency Check
        # Inject NVD API key securely from repository secrets. If not defined, the step runs without the key.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "🔍 Running OWASP dependency vulnerability check..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cd test/load
          chmod +x ./mvnw || true
          # Build extra args dynamically: pass -Dnvd.apiKey only if a key is available.
          EXTRA_ARGS=""
          if [ -n "${NVD_API_KEY}" ]; then
            echo "🔐 NVD API key detected; running with NVD API key (value is masked)."
            # Pass multiple possible property names to be compatible with different plugin versions.
            # cspell:ignore nvdApiKey nvd.apiKey
            EXTRA_ARGS="-DnvdApiKey=${NVD_API_KEY} -Dnvd.apiKey=${NVD_API_KEY}"
          else
            echo "ℹ️ NVD API key not set; running without it (this may be slower)."
          fi
          # Always avoid failing entire CI job if the dependency-check plugin fails to parse the NVD feed.
          # This happens when NVD adds new enum values (e.g., 'SAFETY' for CVSSv4) and the client library is older.
          # Ensure we use a project-local data directory and do not auto-update during analysis.
          EXTRA_ARGS="$EXTRA_ARGS -Ddependency-check.failOnError=false -Ddependency-check.skipRebuild=false -Ddependency-check.dataDirectory=${{ github.workspace }}/test/load/target/dependency-check/data -Ddependency-check.autoUpdate=false -Ddependency-check.connectionString=jdbc:h2:file:${{ github.workspace }}/test/load/target/dependency-check/data/dependency-check-db;DB_CLOSE_ON_EXIT=FALSE"
          ./mvnw org.owasp:dependency-check-maven:check ${EXTRA_ARGS}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ OWASP dependency check completed in: ${DURATION}s"

      # Outdated Dependencies Check
      - name: Check for Outdated Dependencies
        run: |
          echo "🔍 Checking for outdated dependencies..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cd test/load
          chmod +x ./mvnw || true
          ./mvnw versions:display-dependency-updates versions:display-plugin-updates
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Dependency version check completed in: ${DURATION}s"

      # Generate SARIF reports for GitHub Security tab
      - name: Generate SpotBugs SARIF Report
        run: |
          echo "📋 Generating SpotBugs SARIF report..."
          cd test/load
          if [ -f target/spotbugsXml.xml ]; then
            # Convert SpotBugs XML to SARIF if converter is available
            echo "✅ SpotBugs XML report found"
            # Note: SARIF conversion would require additional tooling
            # For now, we'll rely on the Maven plugin output
          else
            echo "ℹ️ No SpotBugs issues found or report not generated"
          fi

      - name: Upload OWASP Dependency Check results
        # https://github.com/github/codeql-action/releases (v3.28.19, 2025-11-06)
        uses: github/codeql-action/upload-sarif@v3.28.19
        with:
          sarif_file: test/load/target/dependency-check/dependency-check-report.sarif
        if: always() && hashFiles('test/load/target/dependency-check/dependency-check-report.sarif') != ''

      - name: Workflow End Summary
        uses: ./.github/actions/workflow-job-end
        if: always()

  # Security Scanning
  # Multiple SAST tools run sequentially in one job for efficiency
  # Tools: Staticcheck (Go linter), Govulncheck (Go vuln scanner), Trivy (dependency scanner)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

      - name: Begin Workflow Job
        id: begin-workflow-job
        uses: ./.github/actions/workflow-job-begin

      - name: Set up Go and validate dependencies
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ steps.begin-workflow-job.outputs.go-version }}
          go-mod-download: true   # govulncheck needs modules to load packages
          go-mod-verify: false    # SAST only needs Go tools, not module operations
          go-mod-tidy: false      # SAST only needs Go tools, not module operations

      # Security Static Analysis with Staticcheck
      - name: Install Staticcheck
        run: |
          echo "🔧 Installing Staticcheck security analysis tool..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Staticcheck installation completed in: ${DURATION}s"

      - name: Run Staticcheck Security Analysis
        run: |
          echo "🔍 Running Staticcheck security analysis..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          if staticcheck -f sarif ./... > staticcheck-raw.sarif; then
            STATICCHECK_EXIT_CODE=0
          else
            STATICCHECK_EXIT_CODE=$?
          fi

          STATICCHECK_EXIT_CODE="$STATICCHECK_EXIT_CODE" python3 - <<'PY'
          import json
          import os
          import posixpath
          import re
          import sys
          from pathlib import Path
          from urllib.parse import quote, unquote, urlsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          try:
              exit_code = int(os.environ["STATICCHECK_EXIT_CODE"])
          except (KeyError, ValueError):
              fail("Staticcheck exit status was unavailable")

          if exit_code not in (0, 1):
              fail(f"Staticcheck execution failed with exit code {exit_code}; see diagnostics above")

          try:
              with open("staticcheck-raw.sarif", encoding="utf-8") as sarif_file:
                  report = json.load(sarif_file)
          except (OSError, json.JSONDecodeError) as error:
              fail(f"Staticcheck did not produce readable SARIF: {error}")

          if not isinstance(report, dict) or report.get("version") != "2.1.0":
              fail("Staticcheck output is not a SARIF 2.1.0 document")
          report["$schema"] = "https://json.schemastore.org/sarif-2.1.0.json"
          runs = report.get("runs")
          if not isinstance(runs, list) or not runs:
              fail("Staticcheck SARIF must contain at least one run")

          finding_count = 0
          for run in runs:
              if not isinstance(run, dict):
                  fail("Staticcheck SARIF contains a malformed run")
              tool = run.get("tool")
              driver = tool.get("driver") if isinstance(tool, dict) else None
              if not isinstance(driver, dict) or not isinstance(driver.get("name"), str) or not driver["name"]:
                  fail("Staticcheck SARIF run is missing tool.driver.name")
              results = run.get("results")
              if not isinstance(results, list):
                  fail("Staticcheck SARIF run is missing its results array")
              finding_count += len(results)

          if exit_code == 1 and finding_count == 0:
              fail("Staticcheck exited with findings status but emitted no SARIF results")
          if exit_code == 1:
              print(f"::warning::Staticcheck reported {finding_count} finding(s); continuing to upload the SARIF report")

          workspace = Path(os.environ.get("GITHUB_WORKSPACE", os.getcwd())).resolve()

          def normalize_artifact_location(location):
              if not isinstance(location, dict):
                  fail("Staticcheck SARIF contains a malformed artifactLocation")
              uri = location.get("uri")
              if not isinstance(uri, str) or not uri.strip():
                  fail("Staticcheck SARIF artifactLocation is missing a usable uri")
              uri = unquote(uri.replace("\\", "/"))
              if uri.startswith("file://"):
                  parsed_uri = urlsplit(uri)
                  if parsed_uri.netloc not in ("", "localhost"):
                      fail(f"Staticcheck SARIF contains a non-local file URI: {uri}")
                  uri = parsed_uri.path
              elif urlsplit(uri).scheme:
                  fail(f"Staticcheck SARIF contains a non-file artifact URI: {uri}")

              if uri.startswith("/"):
                  absolute_path = Path(uri).resolve()
                  try:
                      relative_path = absolute_path.relative_to(workspace)
                  except ValueError:
                      fail(f"Staticcheck SARIF artifact is outside the repository: {uri}")
                  normalized_uri = relative_path.as_posix()
              else:
                  if re.match(r"^[A-Za-z]:/", uri) or uri.startswith("//"):
                      fail(f"Staticcheck SARIF artifact is not repository-relative: {uri}")
                  normalized_uri = posixpath.normpath(uri)
                  if normalized_uri in ("", ".", "..") or normalized_uri.startswith("../") or normalized_uri.startswith("/"):
                      fail(f"Staticcheck SARIF artifact escapes the repository: {uri}")

              if normalized_uri in ("", "."):
                  fail(f"Staticcheck SARIF artifact does not identify a repository file: {uri}")
              location["uri"] = quote(normalized_uri, safe="/-._~")
              location.pop("uriBaseId", None)

          def normalize_locations(value):
              if isinstance(value, dict):
                  physical_location = value.get("physicalLocation")
                  if physical_location is not None:
                      if not isinstance(physical_location, dict) or "artifactLocation" not in physical_location:
                          fail("Staticcheck SARIF physicalLocation is missing artifactLocation")
                      normalize_artifact_location(physical_location["artifactLocation"])
                      region = physical_location.get("region")
                      if region is not None:
                          if not isinstance(region, dict):
                              fail("Staticcheck SARIF physicalLocation contains a malformed region")
                          for coordinate in ("startLine", "startColumn"):
                              number = region.get(coordinate)
                              if number is not None:
                                  if isinstance(number, bool) or not isinstance(number, int) or number < 0:
                                      fail(f"Staticcheck SARIF contains an invalid {coordinate}: {number}")
                                  if number == 0:
                                      region[coordinate] = 1
                  for key, child in value.items():
                      if key == "artifactLocation":
                          normalize_artifact_location(child)
                      elif key == "location" and isinstance(child, dict) and "uri" in child:
                          normalize_artifact_location(child)
                      else:
                          normalize_locations(child)
              elif isinstance(value, list):
                  for child in value:
                      normalize_locations(child)

          normalize_locations(report)
          try:
              temporary_path = "staticcheck-normalized.tmp"
              with open(temporary_path, "w", encoding="utf-8", newline="\n") as sarif_file:
                  json.dump(report, sarif_file, indent=2)
                  sarif_file.write("\n")
              os.replace(temporary_path, "staticcheck.sarif")
          except (OSError, TypeError, ValueError) as error:
              fail(f"Unable to write normalized Staticcheck SARIF: {error}")

          print(f"Staticcheck produced valid SARIF 2.1.0 with {finding_count} finding(s) and repository-relative artifact locations")
          PY
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Staticcheck analysis completed in: ${DURATION}s"

      - name: Upload Staticcheck results to GitHub Security tab
        # https://github.com/github/codeql-action/releases (v3.28.19, 2025-11-06)
        uses: github/codeql-action/upload-sarif@v3.28.19
        with:
          sarif_file: staticcheck.sarif
        if: always() && hashFiles('staticcheck.sarif') != ''

      # Govulncheck - Official Go vulnerability scanner
      - name: Install Govulncheck
        run: |
          echo "🔧 Installing Govulncheck vulnerability scanner..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Govulncheck installation completed in: ${DURATION}s"

      - name: Run Go Vulnerability Check
        run: |
          echo "🔍 Running Go vulnerability check..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          govulncheck ./...
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Go vulnerability check completed in: ${DURATION}s"

      # Trivy - Vulnerability scanner for dependencies
      - name: Run Trivy vulnerability scanner in repo mode
        uses: ./.github/actions/security-scan-trivy
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-sarif-output: 'trivy-results.sarif'
          scan-name: 'Repository Security Scan'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'

      - name: Workflow End Summary
        uses: ./.github/actions/workflow-job-end
        if: always()

  # CodeQL Analysis
  # Multi-language security analysis using CodeQL
  # Matrix covers: Go (primary), JavaScript (embedded JS + shell scripts)
  # Note: 'javascript' pack includes shell script analysis (bash/sh/zsh)
  # No separate 'bash' entry needed - bundled in javascript language pack
  # Java analysis moved to dedicated java-sast job for comprehensive Maven-based analysis
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript']  # go: Go code, javascript: JS+shell scripts (Java moved to dedicated job)
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout-cone-mode: false  # Disabled for cross-platform compatibility between GitHub Actions and act local runner

      - name: Begin Workflow Job
        id: begin-workflow-job
        uses: ./.github/actions/workflow-job-begin

      - name: Initialize CodeQL
        run: |
          echo "🔧 Initializing CodeQL for language: ${{ matrix.language }}..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Execute CodeQL initialization
        # https://github.com/github/codeql-action/releases (v3.28.19, 2025-11-06)
        uses: github/codeql-action/init@v3.28.19
        with:
          languages: ${{ matrix.language }}

      - name: Complete CodeQL initialization timing
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ CodeQL initialization completed in: ${DURATION}s"

      - name: Autobuild
        run: |
          echo "🔨 Running CodeQL autobuild for ${{ matrix.language }}..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Execute CodeQL autobuild
        # https://github.com/github/codeql-action/releases (v3.28.19, 2025-11-06)
        uses: github/codeql-action/autobuild@v3.28.19

      - name: Complete CodeQL autobuild timing
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ CodeQL autobuild completed in: ${DURATION}s"

      - name: Perform CodeQL Analysis
        run: |
          echo "🔍 Performing CodeQL analysis for ${{ matrix.language }}..."
          START_TIME=$(date +%s)
          echo "📅 Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Execute CodeQL analysis
        # https://github.com/github/codeql-action/releases (v3.28.19, 2025-11-06)
        uses: github/codeql-action/analyze@v3.28.19
        with:
          category: "/language:${{matrix.language}}"

      - name: Complete CodeQL analysis timing
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📅 End: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ CodeQL analysis completed in: ${DURATION}s"

      - name: Workflow End Summary
        uses: ./.github/actions/workflow-job-end
        if: always()
