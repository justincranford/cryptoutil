# $schema: https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# WORKFLOW: Race Condition Detection
# PURPOSE: Detect race conditions using Go's ThreadSanitizer via -race flag
# DEPENDENCIES: None (standalone workflow, no external services required)
# EXPECTED DURATION: Unmeasured per partition (run 39356665257 was cancelled at the 30min limit with packages still running)
# TIMEOUT: 90min per partition (four-way exact-once matrix; below GitHub-hosted 360min maximum)
# CRITICAL PATH: go test -race (slowest step due to ThreadSanitizer instrumentation)

name: CI - Race Condition Detection
# CROSS-PLATFORM COMPATIBILITY: All file references in this workflow
# MUST use relative paths to support both GitHub Actions Ubuntu runners
# and Windows `act` local runner testing.
# Absolute paths (e.g., C:\...) break cross-platform compatibility.
# Example: Use './deployments/cryptoutil/compose.yml'

on:
  push:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION
    # Keep synchronized with pull_request below
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  pull_request:
    branches: [ main, develop ]
    # SHARED PATHS-IGNORE CONFIGURATION
    # Keep synchronized with push above
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'workflow-reports/**'
      - 'nohup.out'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '**/*.log'
      - '**/*.sarif'
  workflow_dispatch:

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_NAME: cryptoutil_test
  POSTGRES_USER: cryptoutil
  POSTGRES_PASS: cryptoutil_test_password

jobs:
  race-condition-detection:
    name: Race Condition Detection (${{ matrix.package_root }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package_root:
          - apps
          - apps-framework
          - apps-tools
          - shared

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{ env.POSTGRES_NAME }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASS }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CGO_ENABLED: 1  # Required for race detector (Go toolchain limitation)

    steps:
      - name: Checkout code
        # https://github.com/actions/checkout/releases (v6.0.0, 2025-11-11)
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout-cone-mode: false

      - name: Begin Workflow Job
        id: begin-workflow-job
        uses: ./.github/actions/workflow-job-begin

      - name: Set up Go and validate dependencies
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ steps.begin-workflow-job.outputs.go-version }}
          go-mod-download: true
          go-mod-verify: true
          go-mod-tidy: true

      - name: Run race condition detection tests
        working-directory: .
        run: |
          partition="./internal/${{ matrix.package_root }}/..."
          echo "::group::go test -race ${partition}"
          go test -race -tags integration -timeout=25m -count=2 "${partition}"
          echo "::endgroup::"

      - name: Race condition detection test summary
        run: |
          echo "## 🔄 Race Condition Detection Results" \
            >> $GITHUB_STEP_SUMMARY
          echo "Race condition tests completed successfully." \
            >> $GITHUB_STEP_SUMMARY
          echo "- Full package scope: ./internal/..." >> $GITHUB_STEP_SUMMARY
          echo "- Matrix partition: ./internal/${{ matrix.package_root }}/..." >> $GITHUB_STEP_SUMMARY
          echo "- Race detector: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Test repetitions: 2" >> $GITHUB_STEP_SUMMARY
          echo "- Go test timeout: 25 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Job timeout: 90 minutes" >> $GITHUB_STEP_SUMMARY

      - name: Race summary
        if: always()
        uses: ./.github/actions/workflow-job-end
