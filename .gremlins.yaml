# $schema: https://gremlins.dev/schema/configuration.json
# Gremlins v0.6 configuration. Keep these keys aligned with the pinned CI version.
unleash:
  integration: false
  tags: ""
  coverpkg: "./..."
  output: "gremlins-report.json"
  output-statuses: "klctv"
  workers: 1
  test-cpu: 1
  timeout-coefficient: 30
  threshold:
    efficacy: 95.0
    mutant-coverage: 95.0
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
    - ".*_generated\\.go$"
    - "api/.*"
    - "vendor/.*"
    - ".*mock.*\\.go$"
    - ".*_mock\\.go$"
    - "\\.venv/.*"
    - "node_modules/.*"

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-negatives:
    enabled: true
  invert-assignments:
    enabled: false
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-logical:
    enabled: false
  invert-loopctrl:
    enabled: false
  remove-self-assignments:
    enabled: false
