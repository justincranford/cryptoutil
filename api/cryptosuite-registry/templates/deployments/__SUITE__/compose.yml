# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# __SUITE_UPPER__ SUITE Compose entry point
#
# Includes product app-only models and one shared PostgreSQL pair with suite settings.
#
# Usage:
#   cd deployments/__SUITE__
#   docker compose -f compose.yml up -d
#   docker compose -f compose.yml down
#
include:
  - path:
      - ./compose-apps.yml
      - ../shared-postgres/compose.yml
      - ../__SUITE_INIT_PS_ID__/compose-postgres.yml
      - ./compose-postgres.yml
      - ./compose-telemetry.yml
    env_file: ../__SUITE_INIT_PS_ID__/.env.postgres
