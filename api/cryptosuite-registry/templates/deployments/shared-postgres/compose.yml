# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# Shared PostgreSQL Services for __SUITE__
# Include this file from product-specific compose files using Docker Compose includes.
#
# Architecture:
#   - postgres-leader:   PostgreSQL 18 OLTP (read-write, 21 logical databases, 7 PS-IDs x 3 deployment types)
#   - postgres-follower: PostgreSQL 18 OLAP (read-only replica, 21 matching logical databases)
#
# Logical Database Architecture (Leader - OLTP):
#   Suite-level (7 databases):
#     - suitedeployment-sm-kms
#     - suitedeployment-identity-authz
#     - suitedeployment-identity-idp
#     - suitedeployment-identity-rs
#     - suitedeployment-identity-rp
#     - suitedeployment-identity-spa
#     - suitedeployment-skeleton-template
#
#   Product-level (7 databases):
#     - productdeployment-sm-kms
#     - productdeployment-identity-authz
#     - productdeployment-identity-idp
#     - productdeployment-identity-rs
#     - productdeployment-identity-rp
#     - productdeployment-identity-spa
#     - productdeployment-skeleton-template
#
#   Service-level (7 databases):
#     - servicedeployment-sm-kms
#     - servicedeployment-identity-authz
#     - servicedeployment-identity-idp
#     - servicedeployment-identity-rs
#     - servicedeployment-identity-rp
#     - servicedeployment-identity-spa
#     - servicedeployment-skeleton-template
#
# Logical Database Architecture (Follower - OLAP):
#   One matching subscriber database for each of the leader's 21 tier/PS-ID databases.
#   Setup waits for the active apps' domain migrations, copies matching schemas, then
#   creates subscriptions. PostgreSQL logical replication does not replicate DDL.
#
# Usage: Include this in your product compose.yml:
#   include:
#     - path: ../shared-postgres/compose.yml
#
services:
  # PostgreSQL Leader (OLTP - Read/Write)
  # Hosts 21 logical databases (7 services × 3 deployment types)
  postgres-leader:
    image: postgres:18
    container_name: __SUITE__-postgres-leader
    hostname: postgres-leader
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres-username.secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password.secret
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 512mb
    volumes:
      - postgres_leader_data:/var/lib/postgresql
      - ${POSTGRES_CONF_DIR:-../shared-postgres}/postgresql-leader.conf:/etc/postgresql/postgresql.conf:ro
      - ../shared-postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../shared-postgres/init-leader-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    secrets:
      - postgres-username.secret
      - postgres-password.secret
    healthcheck:
      test: ["CMD-SHELL", "test \"$(ps -p 1 -o comm=)\" = \"postgres\" && pg_isready -h 127.0.0.1 -p 5432 -U \"$(cat /run/secrets/postgres-username.secret)\" -d postgres"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      postgres-network:
        aliases:
          - shared-postgres-leader
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  # PostgreSQL Follower (OLAP - Read-Only Analytics)
  # Logical replication from leader after active application migrations complete.

  postgres-follower:
    image: postgres:18
    container_name: __SUITE__-postgres-follower
    hostname: postgres-follower
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres-username.secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password.secret
      PGUSER_FILE: /run/secrets/postgres-username.secret
      PGPASSWORD_FILE: /run/secrets/postgres-password.secret
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    user: postgres
    # Replication certificate files are owned by GID 65532 with mode 0440.
    group_add:
      - "65532"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set -euo pipefail
        rm -f "$${PGDATA}/replication-setup-complete"
        /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf &
        postgres_pid=$$!
        stop_postgres() {
          kill -TERM "$$postgres_pid" 2>/dev/null || true
          wait "$$postgres_pid" 2>/dev/null || true
        }
        trap stop_postgres EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        # pg_isready can also accept the temporary server used by initdb hooks.
        until [ "$$(ps -p "$$postgres_pid" -o comm= 2>/dev/null | tr -d '[:space:]')" = "postgres" ] \
          && pg_isready -U "$$(cat /run/secrets/postgres-username.secret)" -d postgres; do
          if ! kill -0 "$$postgres_pid" 2>/dev/null; then
            wait "$$postgres_pid"
            exit 1
          fi
          sleep 1
        done
        bash /usr/local/bin/setup-logical-replication.sh
        touch "$${PGDATA}/replication-setup-complete"
        wait "$$postgres_pid"
    shm_size: 1gb
    volumes:
      - postgres_follower_data:/var/lib/postgresql
      - ${POSTGRES_CONF_DIR:-../shared-postgres}/postgresql-follower.conf:/etc/postgresql/postgresql.conf:ro
      - ../shared-postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../shared-postgres/init-follower-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ../shared-postgres/setup-logical-replication.sh:/usr/local/bin/setup-logical-replication.sh:ro
    secrets:
      - postgres-username.secret
      - postgres-password.secret
    depends_on:
      postgres-leader:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$$PGDATA/replication-setup-complete\" && pg_isready -U \"$(cat /run/secrets/postgres-username.secret)\" -d postgres"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres-network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1.5G
          cpus: '1.0'

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres_leader_data:
    name: __SUITE___postgres_leader_volume
  postgres_follower_data:
    name: __SUITE___postgres_follower_volume

secrets:
  postgres-username.secret:
    file: ${POSTGRES_SECRETS_DIR:-./secrets}/postgres-username.secret
  postgres-password.secret:
    file: ${POSTGRES_SECRETS_DIR:-./secrets}/postgres-password.secret
  postgres-database.secret:
    file: ${POSTGRES_SECRETS_DIR:-./secrets}/postgres-database.secret
