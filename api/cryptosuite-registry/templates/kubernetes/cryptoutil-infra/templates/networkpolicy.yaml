kind: NetworkPolicy
metadata:
  name: allow-collector-egress-to-lgtm
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cryptoutil
    cu.io/run: {{ .Values.run | quote }}
    cu.io/release: {{ .Values.helmRelease | quote }}
spec:
  podSelector:
    matchLabels:
      cu.io/run: {{ .Values.run | quote }}
      cu.io/release: {{ .Values.helmRelease | quote }}
      cu.io/component: collector
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cu.io/run: {{ .Values.run | quote }}
              cu.io/release: {{ .Values.helmRelease | quote }}
              cu.io/component: lgtm
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}
{{- if and .Values.components.collector.enabled .Values.components.lgtm.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-ingress-to-lgtm
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cryptoutil
    cu.io/run: {{ .Values.run | quote }}
    cu.io/release: {{ .Values.helmRelease | quote }}
spec:
  podSelector:
    matchLabels:
      cu.io/run: {{ .Values.run | quote }}
      cu.io/release: {{ .Values.helmRelease | quote }}
      cu.io/component: lgtm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cu.io/run: {{ .Values.run | quote }}
              cu.io/release: {{ .Values.helmRelease | quote }}
              cu.io/component: collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}
